name: Deploy Schwab helper

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']

concurrency: deploy-worker

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SCHWAB_APP_KEY: ${{ secrets.SCHWAB_APP_KEY }}
      SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      WRANGLER: npx --yes wrangler@4.150.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the repository secrets
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SCHWAB_APP_KEY SCHWAB_APP_SECRET APP_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret $name (Settings > Secrets and variables > Actions)"; missing=1; fi
          done
          exit $missing

      - name: Tidy the account ID
        run: echo "CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      - name: Find or create the sign-in store
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          check() {
            if [ "$(jq -r .success <<< "$1")" != "true" ]; then
              echo "::error::Cloudflare said: $(jq -r '[.errors[]? | "\(.code) \(.message)"] | join("; ")' <<< "$1" 2>/dev/null || echo "$1" | head -c 300)"
              echo "::error::Check that CLOUDFLARE_ACCOUNT_ID is the Account ID and that the API token was made from the Edit Cloudflare Workers template."
              exit 1
            fi
          }
          list=$(curl -sS -H "$auth" "$api?per_page=100")
          check "$list"
          id=$(jq -r '.result[] | select(.title == "multichart-schwab-tokens") | .id' <<< "$list" | head -1)
          if [ -z "$id" ]; then
            made=$(curl -sS -X POST -H "$auth" -H "Content-Type: application/json" --data '{"title":"multichart-schwab-tokens"}' "$api")
            check "$made"
            id=$(jq -r .result.id <<< "$made")
          fi
          echo "Sign-in store: $id"
          sed -i "s/KV_ID/$id/" wrangler.toml

      - name: Deploy
        run: |
          $WRANGLER deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "### Schwab helper address" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$url\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Paste this into the app: Data source > Schwab > Helper address." >> "$GITHUB_STEP_SUMMARY"

      - name: Store the Schwab keys and app password
        run: |
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          for name in SCHWAB_APP_KEY SCHWAB_APP_SECRET APP_PASSWORD; do
            body=$(jq -n --arg n "$name" --arg v "${!name}" '{name: $n, text: $v, type: "secret_text"}')
            res=$(curl -sS -X PUT -H "$auth" -H "Content-Type: application/json" --data "$body" "$base/scripts/multichart-schwab/secrets")
            if [ "$(jq -r .success <<< "$res" 2>/dev/null)" != "true" ]; then
              echo "::error::Could not save $name: $(jq -r '[.errors[]? | "\(.code) \(.message)"] | join("; ")' <<< "$res" 2>/dev/null || echo "$res" | head -c 300)"
              exit 1
            fi
            echo "Saved $name"
          done

      - name: Show the helper address
        run: |
          sub=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain // empty')
          if [ -n "$sub" ]; then
            echo "::notice title=Schwab helper address::https://multichart-schwab.$sub.workers.dev"
          fi
