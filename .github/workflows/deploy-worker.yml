name: Deploy Schwab helper

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']

concurrency: deploy-worker

# Talks to Cloudflare's API directly, so every failure shows Cloudflare's own error message.
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SCHWAB_APP_KEY: ${{ secrets.SCHWAB_APP_KEY }}
      SCHWAB_APP_SECRET: ${{ secrets.SCHWAB_APP_SECRET }}
      APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
      WORKER: multichart-schwab
    steps:
      - uses: actions/checkout@v4

      - name: Check the repository secrets
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID SCHWAB_APP_KEY SCHWAB_APP_SECRET APP_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret $name (Settings > Secrets and variables > Actions)"; missing=1; fi
          done
          echo "CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')" >> "$GITHUB_ENV"
          exit $missing

      - name: Deploy the helper
        run: |
          acct="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          out="$RUNNER_TEMP/cf.json"
          # cf <what> <curl args...>: call Cloudflare, save the reply in $out, stop with its error message on failure
          cf() {
            what=$1; shift
            curl -sS -H "$auth" "$@" > "$out" || true
            if [ "$(jq -r .success "$out" 2>/dev/null)" != "true" ]; then
              echo "::error::Could not $what. Cloudflare said: $(jq -r '[.errors[]? | "\(.code) \(.message)"] | join("; ")' "$out" 2>/dev/null || head -c 300 "$out")"
              exit 1
            fi
          }

          cf "list KV namespaces" "$acct/storage/kv/namespaces?per_page=100"
          kv=$(jq -r '.result[] | select(.title == "multichart-schwab-tokens") | .id' "$out" | head -1)
          if [ -z "$kv" ]; then
            cf "create the sign-in store" -X POST -H "Content-Type: application/json" --data '{"title":"multichart-schwab-tokens"}' "$acct/storage/kv/namespaces"
            kv=$(jq -r .result.id "$out")
          fi
          echo "Sign-in store: $kv"

          compat=$(sed -n 's/^compatibility_date = "\(.*\)"/\1/p' wrangler.toml)
          jq -n --arg kv "$kv" --arg date "$compat" \
            --arg key "$SCHWAB_APP_KEY" --arg secret "$SCHWAB_APP_SECRET" --arg pw "$APP_PASSWORD" '{
              main_module: "index.js", compatibility_date: $date,
              bindings: [
                {type: "kv_namespace", name: "TOKENS", namespace_id: $kv},
                {type: "secret_text", name: "SCHWAB_APP_KEY", text: $key},
                {type: "secret_text", name: "SCHWAB_APP_SECRET", text: $secret},
                {type: "secret_text", name: "APP_PASSWORD", text: $pw}
              ]}' > "$RUNNER_TEMP/metadata.json"
          cf "upload the helper" -X PUT "$acct/workers/scripts/$WORKER" \
            -F "metadata=@$RUNNER_TEMP/metadata.json;type=application/json" \
            -F "index.js=@src/index.js;type=application/javascript+module"
          echo "Uploaded $WORKER"

          sub=$(curl -sS -H "$auth" "$acct/workers/subdomain" | jq -r '.result.subdomain // empty' || true)
          if [ -z "$sub" ]; then
            echo "::error::Your Cloudflare account has no workers.dev address yet. In Cloudflare, open Workers & Pages once, then run this workflow again from the Actions tab."
            exit 1
          fi
          cf "turn on the workers.dev address" -X POST -H "Content-Type: application/json" --data '{"enabled":true}' "$acct/workers/scripts/$WORKER/subdomain"
          url="https://$WORKER.$sub.workers.dev"
          echo "::notice title=Schwab helper address::$url"
          printf '### Schwab helper address\n\n`%s`\n\nPaste this into the app: Data source > Schwab > Helper address.\n' "$url" >> "$GITHUB_STEP_SUMMARY"
