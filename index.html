<title>Multichart</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-screen dark trading workspace (single deliberate dark look).
   Thin top bar, then rows of tiles (chart / Level II / Time & Sales) with draggable splitters. */
:root {
  color-scheme: dark;
  --bg: #050608;
  --panel: #0b0d10;
  --head: #14171c;
  --line: #262b33;
  --grid: #14181d;
  --fg: #e4e8ec;
  --muted: #8a95a1;
  --accent: #4f8cff;
  --up: #23c26b;
  --down: #f2545b;
  --vwap: #e45cf0;
  --pop: #171b21;
  --chart-bg: #0b0d10;
  --l2-1: #f5d90a; --l2-2: #35c46a; --l2-3: #3aa0ff; --l2-4: #ff7eb6; --l2-5: #b98cff; --l2-6: #8f9aa6;
  --l2-text: #050608;
  --ts-buy: #23c26b; --ts-sell: #f2545b; --ts-mid: #e4e8ec;
  --hover: color-mix(in srgb, var(--fg) 12%, transparent);
  --ui: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --num: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
html { height: 100%; box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; background: var(--bg); color: var(--fg); font-family: var(--ui);
  display: flex; flex-direction: column; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 8px;
  -webkit-tap-highlight-color: transparent;
}
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* top bar */
.bar { display: flex; align-items: center; gap: 8px; padding-block: 8px; min-width: 0; }
.brand { font-weight: 700; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; }
.brand span { color: var(--accent); }
.feed {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 99px;
  border: 1px solid var(--line); color: var(--muted); font-size: 10px; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase; white-space: nowrap;
}
.feed i { width: 7px; height: 7px; border-radius: 50%; background: #e0a526; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.spacer { flex: 1; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px;
  border-radius: 7px; border: 1px solid var(--line); background: var(--head);
  font-weight: 600; font-size: 13px; white-space: nowrap;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn svg { width: 16px; height: 16px; flex: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; height: 32px; }
.seg button { border: 0; background: var(--head); padding: 0 10px; font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--hover); color: var(--fg); }
@media (max-width: 560px) { .btn .lbl, .feed .lbl, .seg .lbl { display: none; } .btn { padding: 0 9px; } .brand { font-size: 14px; } }

/* grid */
.grid { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.box { display: flex; min-height: 0; min-width: 0; }
.box.h { flex-direction: row; } .box.v { flex-direction: column; }
.grid > * { min-height: 0; }
.tile {
  min-width: 0; min-height: 0; display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line); border-radius: 3px; overflow: hidden;
  container-type: inline-size;
}
.split { flex: none; position: relative; touch-action: none; }
.split.h { height: 8px; cursor: row-resize; }
.split.v { width: 8px; cursor: col-resize; }
.split::after { content: ""; position: absolute; border-radius: 2px; background: var(--line); transition: background .15s; }
.split.h::after { left: 50%; top: 2px; width: 34px; height: 4px; margin-left: -17px; }
.split.v::after { top: 50%; left: 2px; height: 34px; width: 4px; margin-top: -17px; }
.split:hover::after, .split.drag::after { background: var(--accent); }
.tile { position: relative; container-type: size; }
.btn[aria-pressed="true"] { background: var(--up); border-color: var(--up); }
@media (max-width: 560px) { #editBtn[aria-pressed="true"] .lbl { display: inline; } }

/* edit layout overlay */
.edit {
  position: absolute; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
  background: rgba(5, 8, 12, .78); border: 2px dashed var(--accent); border-radius: 3px;
}
.grid.editing .edit { display: flex; }
.edit .mid { display: grid; gap: 6px; justify-items: center; text-align: center; padding: 0 44px; }
.edit .what { font-weight: 700; font-size: 14px; }
.edit .what small { display: block; font-family: var(--num); font-weight: 500; font-size: 11px; color: var(--muted); }
.edit .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.edit .acts button { border: 1px solid var(--line); background: var(--head); border-radius: 6px; padding: 5px 9px; font-size: 12px; font-weight: 600; }
.edit .acts .danger { color: var(--down); }
.edit .acts button:disabled { opacity: .4; cursor: default; }
.side-add {
  position: absolute; width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--accent); color: #fff;
  display: grid; place-items: center; box-shadow: 0 2px 10px rgba(0, 0, 0, .5); padding: 0;
}
.side-add svg { width: 16px; height: 16px; }
.side-add[data-side="top"] { top: 6px; left: 50%; margin-left: -17px; }
.side-add[data-side="bottom"] { bottom: 6px; left: 50%; margin-left: -17px; }
.side-add[data-side="left"] { left: 6px; top: 50%; margin-top: -17px; }
.side-add[data-side="right"] { right: 6px; top: 50%; margin-top: -17px; }
@container (max-width: 200px) { .edit .what small { display: none; } .edit .mid { padding: 0 40px; } }
@container (max-height: 200px) {
  .edit .what { display: none; }
  .side-add { width: 28px; height: 28px; }
  .side-add[data-side="top"], .side-add[data-side="bottom"] { margin-left: -14px; }
  .side-add[data-side="left"], .side-add[data-side="right"] { margin-top: -14px; }
  .side-add[data-side="top"] { top: 4px; } .side-add[data-side="bottom"] { bottom: 4px; }
  .side-add[data-side="top"], .side-add[data-side="bottom"] { left: 18%; }
}
@container (max-height: 130px) { .edit .mid { display: none; } .side-add[data-side="top"], .side-add[data-side="bottom"] { left: 50%; } }
@container (max-width: 150px) { .edit .mid { display: none; } }

/* tile header */
.th {
  display: flex; align-items: center; gap: 6px; padding: 3px 3px 3px 4px; min-width: 0; flex: none;
  background: var(--head); border-bottom: 1px solid var(--line); font-family: var(--num); font-variant-numeric: tabular-nums;
}
.sym {
  border: 1px solid var(--line); background: var(--panel); padding: 2px 4px 2px 6px; border-radius: 3px;
  font-family: var(--ui); font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 4px;
  white-space: nowrap; min-width: 62px; justify-content: space-between;
}
.sym svg { width: 9px; height: 9px; color: var(--muted); }
.link {
  width: 18px; height: 18px; flex: none; border-radius: 3px; border: 1px dashed var(--line); background: none;
  font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0; color: var(--muted);
}
.link.on { border: 0; color: #fff; }
.last { font-size: 15px; font-weight: 700; white-space: nowrap; }
.last.up { color: var(--up); } .last.down { color: var(--down); }
.stack { display: grid; font-size: 10.5px; line-height: 1.2; white-space: nowrap; }
.chg.up { color: var(--up); } .chg.down { color: var(--down); }
.ba b { font-weight: 500; }
.ba .bid { color: var(--down); } .ba .ask { color: var(--up); }
.name { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
@container (max-width: 470px) { .ba { display: none; } }
@container (max-width: 330px) { .chg { display: none; } }
@container (max-width: 230px) { .last { font-size: 13px; } .link { display: none; } }
.tf {
  margin-left: auto; height: 24px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel);
  font-family: var(--num); font-size: 12px; font-weight: 600; padding: 0 2px;
}
.ib { width: 26px; height: 24px; flex: none; border: 0; background: none; border-radius: 4px; display: grid; place-items: center; color: var(--muted); }
.ib:hover { background: var(--hover); color: var(--fg); }
.ib svg { width: 16px; height: 16px; }
.body { flex: 1; min-height: 0; position: relative; }
.legend {
  position: absolute; left: 8px; top: 5px; z-index: 3; pointer-events: none;
  font-family: var(--num); font-size: 11px; color: var(--muted);
}
.legend b { font-weight: 500; color: var(--vwap); }

/* Level II and Time & Sales */
.tbl { position: absolute; inset: 0; overflow: auto; font-family: var(--num); font-size: 12px; font-variant-numeric: tabular-nums; }
.book { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); min-height: 100%; }
.side { background: var(--panel); }
.r { display: grid; grid-template-columns: minmax(0, 1fr) 7ch 7ch; gap: 6px; padding: 2px 6px; white-space: nowrap; }
.r > span { overflow: hidden; text-overflow: ellipsis; }
.r > span + span { text-align: right; }
.r.hd { position: sticky; top: 0; background: var(--head); color: var(--muted); font-family: var(--ui); font-size: 11px; font-weight: 600; z-index: 1; }
.book .r:not(.hd) { color: var(--l2-text); border-bottom: 1px solid color-mix(in srgb, var(--l2-text) 18%, transparent); }
.lv0 { background: var(--l2-1); } .lv1 { background: var(--l2-2); } .lv2 { background: var(--l2-3); }
.lv3 { background: var(--l2-4); } .lv4 { background: var(--l2-5); } .lv5 { background: var(--l2-6); }
.book .lv0 { font-weight: 600; }
.tape .r { grid-template-columns: 9ch minmax(0, 1fr) 7ch; border-bottom: 1px solid var(--grid); }
.tape .buy { color: var(--ts-buy); } .tape .sell { color: var(--ts-sell); } .tape .mid { color: var(--ts-mid); }
.tape .big { font-weight: 700; }
@container (max-width: 380px) {
  .book .r { grid-template-columns: minmax(0, 1fr) auto; gap: 4px; padding: 2px 4px; font-size: 10.5px; }
  .book .r > span:first-child { display: none; }
  .book .r > span + span { text-align: left; }
  .book .r > span:last-child { text-align: right; }
  .tape .r { grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px; padding: 2px 4px; font-size: 11px; }
}

/* popover */
.pop {
  position: fixed; z-index: 50; background: var(--pop); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 12px 34px rgba(0, 0, 0, .6); padding: 8px; min-width: 210px; max-width: calc(100vw - 24px);
}
.pop h4 { margin: 4px 6px 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.menu { display: grid; gap: 2px; }
.menu button {
  display: flex; align-items: center; justify-content: space-between; gap: 16px; text-align: left;
  border: 0; background: none; padding: 9px 10px; border-radius: 6px; font-size: 14px;
}
.menu button:hover:not(:disabled) { background: var(--hover); }
.menu button:disabled { color: var(--muted); cursor: default; }
.menu button[aria-current="true"] { color: var(--accent); }
.menu .danger { color: var(--down); }
.menu small { color: var(--muted); font-size: 12px; }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
.check { width: 30px; height: 18px; border-radius: 99px; background: var(--line); position: relative; flex: none; }
.check::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
.check.on { background: var(--vwap); } .check.on::after { transform: translateX(12px); }
.presets { display: grid; grid-template-columns: repeat(4, 56px); gap: 8px; padding: 0 4px 4px; }
.preset { width: 56px; height: 52px; padding: 4px; border: 1px solid var(--line); border-radius: 6px; background: none; display: flex; flex-direction: column; gap: 2px; }
.preset:hover { border-color: var(--accent); }
.preset div { display: flex; gap: 2px; }
.preset span { flex: 1; border-radius: 1.5px; background: #5d6875; }
.preset span.l { background: var(--l2-1); } .preset span.t { background: #3a4552; }
.symform { display: flex; gap: 6px; padding: 0 4px 8px; }
.symform input {
  flex: 1; min-width: 0; height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px;
  background: var(--panel); font-family: var(--num); font-weight: 600; text-transform: uppercase; font-size: 16px;
}
.picks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 0 4px 4px; }
.picks button { border: 1px solid var(--line); background: none; border-radius: 6px; padding: 6px 0; font-family: var(--num); font-size: 12px; font-weight: 600; }
.picks button:hover { border-color: var(--accent); }
.note { margin: 6px 6px 2px; font-size: 12px; color: var(--muted); max-width: 250px; line-height: 1.4; }
/* colors sheet */
.sheet {
  position: fixed; z-index: 60; top: 0; right: 0; bottom: 0; width: min(360px, 100vw); overflow: auto;
  background: var(--pop); border-left: 1px solid var(--line); box-shadow: -12px 0 34px rgba(0, 0, 0, .45);
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) 16px;
}
@media (max-width: 560px) {
  .sheet { top: auto; left: 0; width: auto; height: 60vh; border-left: 0; border-top: 1px solid var(--line); border-radius: 14px 14px 0 0;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); }
}
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.sheet-head h3 { margin: 0; font-size: 17px; }
.sheet h4 { margin: 18px 0 6px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.themes { display: flex; gap: 6px; flex-wrap: wrap; }
.themes button { border: 1px solid var(--line); background: var(--head); border-radius: 99px; padding: 6px 12px; font-size: 13px; font-weight: 600; }
.themes button:hover { border-color: var(--accent); }
.crow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 5px 0; font-size: 14px; border-bottom: 1px solid var(--line); }
.crow input { width: 44px; height: 28px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; cursor: pointer; flex: none; }
.crow input::-webkit-color-swatch-wrapper { padding: 2px; }
.crow input::-webkit-color-swatch { border: 0; border-radius: 4px; }
.sheet .reset { margin-top: 18px; width: 100%; justify-content: center; }
@media (max-width: 400px) { .brand { display: none; } .bar { gap: 6px; } }
@media (prefers-reduced-motion: reduce) { .feed i { animation: none; } }
</style>

<header class="bar">
  <div class="brand">Multi<span>chart</span></div>
  <div class="feed" title="Prices are simulated until your Schwab account is connected"><i></i><span class="lbl">Demo data</span></div>
  <div class="spacer"></div>
  <div class="seg" role="group" aria-label="Workspace mode">
    <button id="modeAll" aria-pressed="true">Full</button>
    <button id="modeCharts" aria-pressed="false">Charts<span class="lbl"> only</span></button>
  </div>
  <button class="btn" id="layoutBtn" aria-label="Choose layout">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1"/><rect x="9" y="9" width="5.5" height="5.5" rx="1"/></svg>
    <span class="lbl">Layout</span>
  </button>
  <button class="btn" id="colorsBtn" aria-label="Colors">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 1.5a6.5 6.5 0 1 0 0 13c1 0 1.5-.6 1.5-1.3 0-.9-.8-1.2-.8-2 0-.7.6-1.2 1.3-1.2h1.6a2.9 2.9 0 0 0 2.9-2.9C14.5 4 11.6 1.5 8 1.5z"/><circle cx="4.8" cy="7" r=".9" fill="currentColor"/><circle cx="7.2" cy="4.4" r=".9" fill="currentColor"/><circle cx="10.4" cy="5" r=".9" fill="currentColor"/></svg>

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
(() => {
/* ---------- demo market data ---------- */
const TF = { '1m': 1, '2m': 2, '5m': 5, '15m': 15, '30m': 30, '1h': 60, 'D': 'D', 'W': 'W' };
const OPEN = 9 * 3600 + 30 * 60;           // 9:30 ET, stored as wall-clock seconds
const SESSION = 390;                        // minutes per regular session
const INTRADAY_DAYS = 10, DAILY_DAYS = 260, LIVE_START = 200;
const BASE = { SPY: 580, QQQ: 505, IWM: 225, DIA: 425, AAPL: 232, MSFT: 425, NVDA: 138, TSLA: 252, AMZN: 188, META: 575, GOOGL: 165, AMD: 155, GLD: 368, UWMC: 1.42, IAUX: 1.46, HGRAF: 2.45 };
const NAMES = { SPY: 'SPDR S&P 500 ETF', QQQ: 'Invesco QQQ Trust', IWM: 'iShares Russell 2000', DIA: 'SPDR Dow Jones ETF', AAPL: 'Apple Inc', MSFT: 'Microsoft Corp', NVDA: 'NVIDIA Corp', TSLA: 'Tesla Inc', AMZN: 'Amazon.com Inc', META: 'Meta Platforms', GOOGL: 'Alphabet Inc', AMD: 'Advanced Micro Devices', GLD: 'SPDR Gold Shares', UWMC: 'UWM Holdings', IAUX: 'i-80 Gold Corp', HGRAF: 'HighGold Mining' };
const PICKS = ['SPY', 'QQQ', 'IWM', 'AAPL', 'NVDA', 'TSLA', 'AMD', 'META', 'GLD', 'UWMC', 'IAUX', 'HGRAF'];
const VENUES = ['NSDQ', 'ARCA', 'NYSE', 'EDGX', 'BATS', 'IEX', 'MEMX', 'CBOE', 'MF/MM', 'OTC OTH', 'CHXE'];
const LINK_COLORS = ['', '#e0a526', '#2fa7e0', '#e8644f', '#2fae5d', '#9b6cf0'];

function rng(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function gauss(r) { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const pick = a => a[Math.floor(Math.random() * a.length)];

function tradingDays(n) {
  const out = [], d = new Date();
  d.setUTCHours(0, 0, 0, 0);
  while (out.length < n) {
    const wd = d.getUTCDay();
    if (wd !== 0 && wd !== 6) out.unshift(d.getTime() / 1000);
    d.setUTCDate(d.getUTCDate() - 1);
  }
  return out;
}

const stores = {};
function store(sym) {
  if (stores[sym]) return stores[sym];
  const r = rng(hash(sym));
  const days = tradingDays(DAILY_DAYS);
  const dvol = 0.011 + r() * 0.014, mvol = dvol / Math.sqrt(SESSION);
  const base = BASE[sym] ?? (20 + r() * 280);
  let px = base * (0.82 + r() * 0.2);
  const daily = [], m1 = [];
  days.forEach((day, di) => {
    if (di < DAILY_DAYS - INTRADAY_DAYS) {
      const o = px * (1 + gauss(r) * dvol * 0.25), c = o * (1 + gauss(r) * dvol + 0.0004);
      const h = Math.max(o, c) * (1 + Math.abs(gauss(r)) * dvol * 0.4);
      const l = Math.min(o, c) * (1 - Math.abs(gauss(r)) * dvol * 0.4);
      daily.push({ time: day, open: o, high: h, low: l, close: c, volume: Math.round(4e7 * (0.6 + r())) });
      px = c;
      return;
    }
    const mins = di === DAILY_DAYS - 1 ? LIVE_START : SESSION;
    let p = px * (1 + gauss(r) * dvol * 0.25);
    const dayBars = [];
    for (let i = 0; i < mins; i++) {
      const o = p, c = o * (1 + gauss(r) * mvol);
      const h = Math.max(o, c) * (1 + Math.abs(gauss(r)) * mvol * 0.5);
      const l = Math.min(o, c) * (1 - Math.abs(gauss(r)) * mvol * 0.5);

function setSymbol(t, sym) {
  const g = t.cell.link;
  allCells().forEach(c => { if (c === t.cell || (g && c.link === g)) c.sym = sym; });
  tiles.forEach(x => { if (x.cell === t.cell || (g && x.cell.link === g)) x.load(); });
  save();
}

// Add a panel on one side of an existing panel. Level II and Time & Sales link to the panel they sit next to.
function insertPanel(target, side, kind) {
  maxed = null;
  if (kind !== 'chart') state.chartsOnly = false;
  const charts = allCells().filter(c => c.kind === 'chart');
  const cell = kind === 'chart' ? newCell('chart', DEFAULT_CHARTS[charts.length % DEFAULT_CHARTS.length]) : newCell(kind);
  if (kind !== 'chart') {
    if (!target.link) target.link = freeLink();
    cell.link = target.link; cell.sym = target.sym;
  }
  const dir = side === 'left' || side === 'right' ? 'h' : 'v';
  const before = side === 'left' || side === 'top';
  const share = kind === 'chart' ? 1 : 0.6;
  const p = parentOf(target);
  if (p && p.dir === dir) {
    const total = target.size;
    target.size = total / (1 + share); cell.size = total * share / (1 + share);
    const i = p.children.indexOf(target);
    p.children.splice(before ? i : i + 1, 0, cell);
  } else {
    const wrap = { dir, size: target.size, children: [] };
    replaceNode(target, wrap);
    target.size = 1; cell.size = share;
    wrap.children = before ? [cell, target] : [target, cell];
  }
  render();
}
function removePanel(id) {
  if (allCells().length < 2) return;
  const cell = allCells().find(c => c.id === id), p = parentOf(cell);
  if (!p) return;
  p.children = p.children.filter(c => c !== cell);
  state.root = normalize(state.root);
  render();
}

/* ---------- popovers ---------- */
const pop = document.getElementById('pop');
let popAnchor = null;
function openPop(anchor, html, bind) {
  if (popAnchor === anchor && !pop.hidden) return closePop();
  popAnchor = anchor;
  pop.innerHTML = html;
  pop.hidden = false;
  bind(pop);
  const a = anchor.getBoundingClientRect(), p = pop.getBoundingClientRect();
  const left = Math.max(12, Math.min(innerWidth - p.width - 12, a.left));
  let top = a.bottom + 6;
  if (top + p.height > innerHeight - 12) top = Math.max(12, a.top - p.height - 6);
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
}
function closePop() { pop.hidden = true; popAnchor = null; }
document.addEventListener('pointerdown', e => { if (!pop.hidden && !pop.contains(e.target) && !popAnchor.contains(e.target)) closePop(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePop(); });

function tileMenu(anchor, t) {
  const isChart = t.kind === 'chart', can = t.intraday, isMax = maxed === t.cell.id, only = allCells().length < 2;
  openPop(anchor, `
    <div class="menu">
      ${isChart ? `<button data-a="vwap" ${can ? '' : 'disabled'}><span>VWAP${can ? '' : ' <small>intraday only</small>'}</span><span class="check ${t.cell.vwap && can ? 'on' : ''}"></span></button>` : ''}
      <button data-a="max"><span>${isMax ? 'Back to grid' : 'Expand to full screen'}</span></button>
      <hr>
      ${Object.entries(KINDS).map(([k, label]) => `<button data-k="${k}" aria-current="${t.kind === k}"><span>Show as ${label}</span></button>`).join('')}
      <hr>
      <button data-a="del" class="danger" ${only ? 'disabled' : ''}><span>Remove panel</span></button>
    </div>`, p => {
    const v = p.querySelector('[data-a=vwap]');
    if (v) v.onclick = () => { t.cell.vwap = !t.cell.vwap; t.load(); save(); closePop(); };
    p.querySelector('[data-a=max]').onclick = () => { closePop(); toggleMax(t); };
    p.querySelector('[data-a=del]').onclick = () => { closePop(); removePanel(t.cell.id); };
    p.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { closePop(); t.cell.kind = b.dataset.k; render(); });
  });
}

function addPop(anchor, t, side) {
  const where = side === 'top' ? 'above' : side === 'bottom' ? 'below' : 'to the ' + side;
  openPop(anchor, `
    <h4>Add ${where}</h4>
    <div class="menu">${Object.entries(KINDS).map(([k, label]) => `<button data-k="${k}"><span>${label}</span></button>`).join('')}</div>`, p => {
    p.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { closePop(); insertPanel(t.cell, side, b.dataset.k); });
  });
}
function typePop(anchor, t) {
  openPop(anchor, `
    <h4>Panel type</h4>
    <div class="menu">${Object.entries(KINDS).map(([k, label]) => `<button data-k="${k}" aria-current="${t.kind === k}"><span>${label}</span></button>`).join('')}</div>`, p => {
    p.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { closePop(); t.cell.kind = b.dataset.k; render(); });
  });
}

function linkPop(anchor, t) {
  openPop(anchor, `
    <h4>Link group</h4>
    <div class="menu">
      ${[0, 1, 2, 3, 4, 5].map(g => `<button data-g="${g}" aria-current="${(t.cell.link || 0) === g}"><span>${g ? 'Group ' + g : 'Not linked'}</span>${g ? `<span class="link on" style="background:${LINK_COLORS[g]}">${g}</span>` : ''}</button>`).join('')}
    </div>
    <p class="note">Panels in the same group always show the same symbol.</p>`, p => {
    p.querySelectorAll('[data-g]').forEach(b => b.onclick = () => {
      const g = +b.dataset.g;
      t.cell.link = g;
      const leader = g && allCells().find(c => c !== t.cell && c.link === g);
      if (leader) t.cell.sym = leader.sym;
      t.load(); save(); closePop();
    });
  });
}

function symbolPop(anchor, t) {
  openPop(anchor, `
    <h4>Symbol</h4>
    <form class="symform"><input id="symInput" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="8" value="${t.cell.sym}" aria-label="Ticker symbol"><button class="btn primary" type="submit">Go</button></form>
    <div class="picks">${PICKS.map(s => `<button data-s="${s}">${s}</button>`).join('')}</div>`, p => {
    const set = sym => { sym = sym.trim().toUpperCase().replace(/[^A-Z0-9.\/]/g, ''); if (!sym) return; setSymbol(t, sym); closePop(); };
    p.querySelector('form').onsubmit = e => { e.preventDefault(); set(p.querySelector('input').value); };
    p.querySelectorAll('[data-s]').forEach(b => b.onclick = () => set(b.dataset.s));
    if (matchMedia('(pointer: fine)').matches) p.querySelector('input').select();
  });
}

document.getElementById('layoutBtn').addEventListener('click', e => {
  const cls = { c: '', l: 'l', t: 't' };
  openPop(e.currentTarget, `
    <h4>Layout</h4>
    <div class="presets">${PRESETS.map((shape, i) => `<button class="preset" data-i="${i}" aria-label="Layout ${i + 1}">${shape.map(code => `<div style="flex:${code.includes('c') ? 2 : 1}">${[...code].map(ch => `<span class="${cls[ch]}"></span>`).join('')}</div>`).join('')}</button>`).join('')}</div>
    <p class="note">Grey is a chart, blue is Level II, dark grey is Time & Sales. Drag the bars between panels to resize. Your layout is saved on this device.</p>`, p => {
    p.querySelectorAll('.preset').forEach(b => b.onclick = () => {
      maxed = null;
      const shape = PRESETS[+b.dataset.i];
      if (shape.some(code => /[lt]/.test(code))) state.chartsOnly = false;
      state.root = fromPreset(shape);
      render(); closePop();
    });
  });
});
document.getElementById('editBtn').addEventListener('click', () => { editing = !editing; maxed = null; closePop(); render(); });
document.getElementById('modeAll').addEventListener('click', () => { state.chartsOnly = false; render(); });
document.getElementById('modeCharts').addEventListener('click', () => { state.chartsOnly = true; render(); });

/* ---------- colors ---------- */
const COLOR_KEY = 'multichart-colors-v1';
const COLOR_GROUPS = [
  ['Workspace', [['bg', 'App background'], ['head', 'Panel headers'], ['line', 'Borders'], ['fg', 'Text'], ['muted', 'Secondary text'], ['accent', 'Buttons and highlights'], ['pop', 'Menus']]],
  ['Charts', [['chart-bg', 'Chart background'], ['grid', 'Grid lines'], ['up', 'Up candles and volume'], ['down', 'Down candles and volume'], ['vwap', 'VWAP line']]],
  ['Level II', [['l2-1', 'Level 1 (best bid and ask)'], ['l2-2', 'Level 2'], ['l2-3', 'Level 3'], ['l2-4', 'Level 4'], ['l2-5', 'Level 5'], ['l2-6', 'Level 6 and deeper'], ['l2-text', 'Level text'], ['panel', 'Level II and T&S background']]],
  ['Time & Sales', [['ts-buy', 'Buys (at the ask)'], ['ts-sell', 'Sells (at the bid)'], ['ts-mid', 'Between bid and ask']]]
];
const THEMES = {
  'Dark': {},
  'DAS classic': {
    bg: '#000000', head: '#1b1b1b', line: '#3a3a3a', pop: '#141414', 'chart-bg': '#000000', panel: '#000000', grid: '#1a1a1a',
    'l2-1': '#ffff00', 'l2-2': '#00d000', 'l2-3': '#00c8ff', 'l2-4': '#ff5fd2', 'l2-5': '#ff9a00', 'l2-6': '#a0a0a0',
    'ts-buy': '#00ff00', 'ts-sell': '#ff3030', 'ts-mid': '#ffffff'
  },
  'Light': {
    bg: '#e9edf1', panel: '#ffffff', 'chart-bg': '#ffffff', head: '#f4f6f8', line: '#cfd6de', grid: '#eef1f5', fg: '#131b24',
    muted: '#5b6878', accent: '#2457d6', up: '#0f8a62', down: '#d1433a', vwap: '#c026d3', pop: '#ffffff', 'l2-6': '#c9d1da',
    'ts-buy': '#0f8a62', 'ts-sell': '#d1433a', 'ts-mid': '#131b24'
  }
};
const DEFAULT_COLORS = {};
COLOR_GROUPS.forEach(([, list]) => list.forEach(([k]) => { DEFAULT_COLORS[k] = css('--' + k); }));
let colors = {};
try { colors = JSON.parse(localStorage.getItem(COLOR_KEY)) || {}; } catch (e) {}

const isLight = hex => { const n = parseInt(hex.slice(1), 16); return ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000 > 140; };
function applyColors() {
  const root = document.documentElement;
  Object.keys(DEFAULT_COLORS).forEach(k => {
    if (colors[k]) root.style.setProperty('--' + k, colors[k]); else root.style.removeProperty('--' + k);
  });
  root.style.colorScheme = isLight(css('--bg')) ? 'light' : 'dark';
  tiles.forEach(t => t.retheme());
  try { localStorage.setItem(COLOR_KEY, JSON.stringify(colors)); } catch (e) {}
}

const sheet = document.getElementById('sheet');
function openColors() {
  closePop();
  sheet.innerHTML = `
    <div class="sheet-head"><h3>Colors</h3><button class="ib" id="sheetClose" aria-label="Close colors"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
    <h4>Start from a theme</h4>
    <div class="themes">${Object.keys(THEMES).map(n => `<button data-theme-name="${n}">${n}</button>`).join('')}</div>
    ${COLOR_GROUPS.map(([group, list]) => `<h4>${group}</h4>` + list.map(([k, label]) =>
      `<label class="crow"><span>${label}</span><input type="color" id="c-${k}" data-k="${k}" value="${colors[k] || DEFAULT_COLORS[k]}"></label>`).join('')).join('')}
    <button class="btn reset" id="resetColors">Reset to default colors</button>`;
  sheet.hidden = false;
  sheet.querySelector('#sheetClose').onclick = () => { sheet.hidden = true; };
  sheet.querySelectorAll('input[type=color]').forEach(inp => inp.addEventListener('input', () => { colors[inp.dataset.k] = inp.value; applyColors(); }));
  sheet.querySelectorAll('[data-theme-name]').forEach(b => b.onclick = () => { colors = { ...THEMES[b.dataset.themeName] }; applyColors(); openColors(); });
  sheet.querySelector('#resetColors').onclick = () => { colors = {}; applyColors(); openColors(); };
}
document.getElementById('colorsBtn').addEventListener('click', () => { if (sheet.hidden) openColors(); else sheet.hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') sheet.hidden = true; });
applyColors();

/* ---------- go ---------- */
render();
setInterval(() => {
  new Set(allCells().map(c => c.sym)).forEach(s => tick(store(s)));
  tiles.forEach(t => t.update());
}, 700);
})();
</script>
