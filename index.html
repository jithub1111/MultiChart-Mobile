<title>Multichart</title>
<!-- Added to the Home Screen, the app opens full screen without Safari's bars. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Multichart">
<meta name="theme-color" content="#050608">
<!-- width=980 is what iPhone uses for pages without this tag, so the layout stays as it was;
     viewport-fit=cover lets the page reach into the sides of the screen in landscape. -->
<meta name="viewport" content="width=980, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Open+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: full-screen dark trading workspace (single deliberate dark look).
   Thin top bar, then rows of tiles (chart / Level II / Time & Sales) with draggable splitters. */
:root {
  color-scheme: dark;
  --bg: #050608;
  --panel: #0b0d10;
  --head: #14171c;
  --line: #262b33;
  --grid: #14181d;
  --fg: #e4e8ec;
  --muted: #8a95a1;
  --accent: #4f8cff;
  --up: #23c26b;
  --down: #f2545b;
  --flat: var(--up);  /* candles that close where they opened */
  --vwap: #e45cf0;
  --ext: #9aa4b0;
  --pop: #171b21;
  --chart-bg: #0b0d10;
  --l2-1: #f5d90a; --l2-2: #35c46a; --l2-3: #3aa0ff; --l2-4: #ff7eb6; --l2-5: #b98cff; --l2-6: #8f9aa6;
  --l2-text: #050608;
  --ts-buy: #23c26b; --ts-sell: #f2545b; --ts-mid: #e4e8ec;
  --draw: #f0b429; --alert: #ff8a3d;
  --scale: 1;
  --hover: color-mix(in srgb, var(--fg) 12%, transparent);
  --ui: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --num: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
html { height: 100%; box-sizing: border-box; }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; background: var(--bg); color: var(--fg); font-family: var(--ui);
  display: flex; flex-direction: column; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: max(8px, calc(env(safe-area-inset-bottom, 0px) - 8px));
  -webkit-tap-highlight-color: transparent;
}
/* Phone in landscape: iPhone reserves the same margin on both sides, but the camera cutout is on
   only one. Fill the other side, and come close to the cutout without going under it. */
html.cut-left body { padding-left: max(16px, calc(env(safe-area-inset-left, 0px) - 10px)); padding-right: 20px; }
html.cut-right body { padding-right: max(16px, calc(env(safe-area-inset-right, 0px) - 10px)); padding-left: 20px; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* top bar */
.bar { display: flex; align-items: center; gap: 7px; padding-block: 8px; min-width: 0; }
/* when the buttons no longer fit, they wrap onto a second line, lined up on the right under Colors */
.bar { flex-wrap: wrap; justify-content: flex-end; row-gap: 6px; } .bar > * { flex-shrink: 0; }
.brand { font-weight: 700; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; }
/* "chart" shades from cyan to the neon green of the app icon */
.brand span { background: linear-gradient(90deg, #22d3ee, #39ff88); -webkit-background-clip: text; background-clip: text; color: transparent; }
.feed {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 99px;
  border: 1px solid var(--line); color: var(--muted); font-size: 10px; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase; white-space: nowrap;
}
.feed i { width: 7px; height: 7px; border-radius: 50%; background: #e0a526; animation: pulse 1.6s ease-in-out infinite; }
button.feed { background: none; height: 26px; cursor: pointer; }
button.feed:hover { background: var(--hover); color: var(--fg); }
.feed[data-state="connecting"] i { background: #2fa7e0; }
.feed[data-state="live"] i { background: #2fae5d; }
.feed[data-state="live"] { color: var(--fg); }
.feed[data-state="error"] i { background: #e8644f; animation: none; }
@keyframes pulse { 50% { opacity: .3; } }
/* hide the top bar (and the tabs) for more chart space; a small arrow at the top brings it back */
/* kept narrow (no box, tighter gaps, slimmer zoom label) so the tabs still fit up in the bar */
.btn.hidebar { width: 16px; margin-inline: -2px; padding: 0; justify-content: center; border-color: transparent; background: none; color: var(--muted); }
.btn.hidebar:hover { color: var(--fg); }
.hidebar svg { width: 12px; height: 12px; }
.showbar { display: none; position: fixed; z-index: 60; left: 50%; top: env(safe-area-inset-top, 0px); transform: translateX(-50%);
  width: 34px; height: 13px; padding: 0; border: 1px solid var(--line); border-top: 0; border-radius: 0 0 7px 7px;
  background: color-mix(in srgb, var(--head) 85%, transparent); color: var(--muted); align-items: center; justify-content: center; }
.showbar:hover { color: var(--fg); background: var(--hover); }
.showbar svg { width: 10px; height: 10px; }
html.nobar .bar, html.nobar .tabs { display: none; }
html.nobar .showbar { display: inline-flex; }
.spacer { flex: 1; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px;
  border-radius: 7px; border: 1px solid var(--line); background: var(--head);
  font-weight: 600; font-size: 13px; white-space: nowrap;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn svg { width: 16px; height: 16px; flex: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; height: 32px; }
.seg button { border: 0; background: var(--head); padding: 0 10px; font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--hover); color: var(--fg); }
@media (max-width: 560px) { .btn .lbl, .feed .lbl, .seg .lbl { display: none; } .btn { padding: 0 9px; } .brand { font-size: 14px; } }

/* grid */
.grid { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.box { display: flex; min-height: 0; min-width: 0; }
.box.h { flex-direction: row; } .box.v { flex-direction: column; }
.grid > * { min-height: 0; }
.tile {
  min-width: 0; min-height: 0; display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line); border-radius: 3px; overflow: hidden;
  container-type: inline-size;
}
.split { flex: none; position: relative; touch-action: none; }
.split.h { height: 8px; cursor: row-resize; }
.split.v { width: 8px; cursor: col-resize; }
.split::after { content: ""; position: absolute; border-radius: 2px; background: var(--line); transition: background .15s; }
.split.h::after { left: 50%; top: 2px; width: 34px; height: 4px; margin-left: -17px; }
.split.v::after { top: 50%; left: 2px; height: 34px; width: 4px; margin-top: -17px; }
.split:hover::after, .split.drag::after { background: var(--accent); }
.tile { position: relative; container-type: size; }
.btn[aria-pressed="true"] { background: var(--up); border-color: var(--up); }
@media (max-width: 560px) { #editBtn[aria-pressed="true"] .lbl { display: inline; } }

/* edit layout overlay */
.edit {
  position: absolute; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
  background: rgba(5, 8, 12, .78); border: 2px dashed var(--accent); border-radius: 3px;
}
.grid.editing .edit { display: flex; }
.edit .mid { display: grid; gap: 6px; justify-items: center; text-align: center; padding: 0 44px; }
.edit .what { font-weight: 700; font-size: 14px; }
.edit .what small { display: block; font-family: var(--num); font-weight: 500; font-size: 11px; color: var(--muted); }
.edit .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.edit .acts button { border: 1px solid var(--line); background: var(--head); border-radius: 6px; padding: 5px 9px; font-size: 12px; font-weight: 600; }
.edit .acts .danger { color: var(--down); }
.edit .acts button:disabled { opacity: .4; cursor: default; }
.side-add {
  position: absolute; width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--accent); color: #fff;
  display: grid; place-items: center; box-shadow: 0 2px 10px rgba(0, 0, 0, .5); padding: 0;
}
.side-add svg { width: 16px; height: 16px; }
.side-add[data-side="top"] { top: 6px; left: 50%; margin-left: -17px; }
.side-add[data-side="bottom"] { bottom: 6px; left: 50%; margin-left: -17px; }
.side-add[data-side="left"] { left: 6px; top: 50%; margin-top: -17px; }
.side-add[data-side="right"] { right: 6px; top: 50%; margin-top: -17px; }
@container (max-width: 200px) { .edit .what small { display: none; } .edit .mid { padding: 0 40px; } }
@container (max-height: 200px) {
  .edit .what { display: none; }
  .side-add { width: 28px; height: 28px; }
  .side-add[data-side="top"], .side-add[data-side="bottom"] { margin-left: -14px; }
  .side-add[data-side="left"], .side-add[data-side="right"] { margin-top: -14px; }
  .side-add[data-side="top"] { top: 4px; } .side-add[data-side="bottom"] { bottom: 4px; }
  .side-add[data-side="top"], .side-add[data-side="bottom"] { left: 18%; }
}
@container (max-height: 130px) { .edit .mid { display: none; } .side-add[data-side="top"], .side-add[data-side="bottom"] { left: 50%; } }
@container (max-width: 150px) { .edit .mid { display: none; } }

/* tile header */
.th {
  display: flex; align-items: center; gap: 6px; padding: 3px 3px 3px 4px; min-width: 0; flex: none;
  background: var(--head); border-bottom: 1px solid var(--line); font-family: var(--num); font-variant-numeric: tabular-nums;
}
.sym {
  border: 1px solid var(--line); background: var(--panel); padding: 2px 4px 2px 6px; border-radius: 3px;
  font-family: var(--ui); font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 4px;
  white-space: nowrap; min-width: 62px; justify-content: space-between;
}
.sym svg { width: 9px; height: 9px; color: var(--muted); }
.link {
  width: 18px; height: 18px; flex: none; border-radius: 3px; border: 1px dashed var(--line); background: none;
  font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0; color: var(--muted);
}
.link.on { border: 0; color: #fff; }
.last { font-size: 15px; font-weight: 700; white-space: nowrap; }
.last.up { color: var(--up); } .last.down { color: var(--down); }
.stack { display: grid; font-size: 10.5px; line-height: 1.2; white-space: nowrap; }
.chg.up { color: var(--up); } .chg.down { color: var(--down); }
.ba b { font-weight: 500; }
.ba .bid { color: var(--down); } .ba .ask { color: var(--up); }
/* TOS Theme Full: thinkorswim's plain sans-serif numbers, with the bid in green and the ask in red */
.tos .th { font-family: "Open Sans", "Segoe UI", system-ui, sans-serif; }
.tos .ba .bid { color: var(--up); } .tos .ba .ask { color: var(--down); }
.name { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
@container (max-width: 470px) { .ba { display: none; } }
@container (max-width: 330px) {
  .chg { display: none; }
  .th { gap: 4px; }
  /* small panels: the day and timeframe boxes drop their arrows to leave room for the buttons */
  .tf { appearance: none; -webkit-appearance: none; padding: 0 5px; text-align: center; }
  .days + .tf { margin-left: 2px; }
}
/* the price scale already shows the last price, so the smallest charts give its header spot to the buttons */
@container (max-width: 250px) { .ctile .th .last { display: none; } }
@container (max-width: 230px) { .last { font-size: 13px; } .tile:not(.wtile) .link { display: none; } }
.days + .tf { margin-left: 3px; }
.tf {
  margin-left: auto; height: 24px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel);
  font-family: var(--num); font-size: 12px; font-weight: 600; padding: 0 2px;
}
.ib { width: 26px; height: 24px; flex: none; border: 0; background: none; border-radius: 4px; display: grid; place-items: center; color: var(--muted); }
.ib:hover { background: var(--hover); color: var(--fg); }
.ib svg { width: 16px; height: 16px; }
.body { flex: 1; min-height: 0; position: relative; }
.legend {
  position: absolute; left: 8px; top: 5px; z-index: 3; pointer-events: none;
  font-family: var(--num); font-size: 11px; color: var(--muted);
}
.legend b { font-weight: 500; color: var(--vwap); }

/* Level II and Time & Sales */
.msg { position: absolute; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center; text-align: center; padding: 12px; color: var(--muted); font-size: 13px; zoom: var(--scale); pointer-events: none; }
.msg.err { color: var(--fg); }
.simnote { position: sticky; top: 0; z-index: 1; padding: 2px 6px; font-family: system-ui, sans-serif; font-size: .84em; color: var(--muted); background: var(--head); border-bottom: 1px solid var(--line); }
/* --tsize is the panel's own text size (Text size in its menu); the rows and columns grow with it */
.tbl { position: absolute; inset: 0; overflow: auto; font-family: var(--num); font-size: calc(12px * var(--tsize, 1)); font-variant-numeric: tabular-nums; }
.duo { position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 1px; background: var(--line); }
.duo > .tbl { position: relative; inset: auto; background: var(--panel); container-type: size; }
.book { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); min-height: 100%; }
/* Each side of the book is one grid, and its rows share its columns (subgrid), so the columns line up down the side
   and fit what's in them. The MMID column gives way first when the panel is narrow. */
.side { background: var(--panel); display: grid; grid-template-columns: minmax(0, 1fr) max-content max-content; column-gap: 6px; align-content: start; }
.side .r { grid-column: 1 / -1; grid-template-columns: subgrid; column-gap: inherit; }
.side .r small { font-size: .85em; opacity: .75; }
.r { display: grid; grid-template-columns: minmax(0, 1fr) 7ch 7ch; gap: 6px; padding: 2px 6px; white-space: nowrap; }
.r > span { overflow: hidden; text-overflow: ellipsis; }
.r > span + span { text-align: right; }
.r.hd { position: sticky; top: 0; background: var(--head); color: var(--muted); font-family: var(--ui); font-size: .92em; font-weight: 600; z-index: 1; }
.book .r:not(.hd) { color: var(--l2-text); border-bottom: 1px solid color-mix(in srgb, var(--l2-text) 18%, transparent); }
.lv0 { background: var(--l2-1); } .lv1 { background: var(--l2-2); } .lv2 { background: var(--l2-3); }
.lv3 { background: var(--l2-4); } .lv4 { background: var(--l2-5); } .lv5 { background: var(--l2-6); }
.book .lv0 { font-weight: 600; }
/* Basic Level II: plain rows in the text color, like thinkorswim */
.l2basic .book .r:not(.hd) { background: none; color: var(--fg); font-weight: 400; border-bottom-color: var(--grid); }
.l2style { display: flex; margin: 0 4px 6px; }
.l2style button { flex: 1; }
.tape .r { grid-template-columns: 9ch minmax(0, 1fr) 7ch; border-bottom: 1px solid var(--grid); }
.tape .buy { color: var(--ts-buy); } .tape .sell { color: var(--ts-sell); } .tape .mid { color: var(--ts-mid); }
.tape .big { font-weight: 700; }
@container (max-width: 380px) {
  .side { column-gap: 4px; }
  .book .r { padding: 2px 4px; font-size: .875em; }
  .tape .r { grid-template-columns: minmax(0, 1fr) auto auto; gap: 6px; padding: 2px 4px; font-size: .92em; }  /* when squeezed, the time gives way before the price */
}

/* Fundamentals panel */
.fund { position: absolute; inset: 0; display: flex; flex-direction: column; font-size: 13px; }
.ftabs { display: flex; gap: 2px; padding: 4px; background: var(--head); border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; flex: none; }
.ftabs button { flex: none; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 5px; white-space: nowrap; }
.ftabs button[aria-current="true"] { background: var(--hover); color: var(--fg); }
.ftabs .short { display: none; }
@container (max-width: 400px) { .ftabs .long { display: none; } .ftabs .short { display: inline; } }
.fbody { flex: 1; min-height: 0; overflow: auto; }
.fnote { margin: 0; padding: 12px; color: var(--muted); font-size: 12px; line-height: 1.45; }
.fnote.err { color: var(--fg); }
.fnote a, .fdesc a { color: var(--accent); }
.fform { display: flex; gap: 6px; padding: 0 12px 12px; }
.fform input { flex: 1; min-width: 0; height: 34px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); font-size: 16px; }
.nitem { display: block; padding: 8px 10px; border-bottom: 1px solid var(--grid); color: var(--fg); text-decoration: none; }
.nitem:hover { background: var(--hover); }
.nitem.fresh { box-shadow: inset 3px 0 var(--accent); }
.nitem b { display: block; font-weight: 500; line-height: 1.3; }
.nitem small, .frow small { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
.fstats { columns: 2 230px; column-gap: 16px; padding: 4px 10px 10px; }
.ffloat { padding: 6px 10px 4px; border-bottom: 1px solid var(--line); }
.ffloat table { width: 100%; border-collapse: collapse; font-size: 12px; }
.ffloat th { font-size: 10px; font-weight: 600; color: var(--muted); text-align: right; padding: 0 0 3px 10px; }
.ffloat td { padding: 2px 0 2px 10px; text-align: right; font-family: var(--num); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ffloat td:first-child { padding-left: 0; text-align: left; color: var(--muted); font-family: var(--ui); white-space: normal; }
.ffloat .fnote { padding: 6px 0 2px; }
.fgroup { break-inside: avoid; padding-top: 6px; }
.fgroup h5, .fprof h5, .ffloat h5 { margin: 4px 0; font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.kv { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 3px 12px; margin: 0; font-size: 12px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; text-align: right; font-family: var(--num); font-variant-numeric: tabular-nums; }
.fprof { padding: 6px 10px 10px; }
.fprof p { margin: 4px 0 10px; line-height: 1.45; }
.fprof .kv dd { font-family: var(--ui); overflow-wrap: anywhere; }
.fchips { display: flex; flex-wrap: wrap; gap: 4px; padding: 6px 8px; border-bottom: 1px solid var(--line); }
.fchips button { border: 1px solid var(--line); background: none; color: var(--muted); font-size: 11px; padding: 3px 8px; border-radius: 99px; }
.fchips button[aria-current="true"] { border-color: var(--accent); color: var(--fg); }
.frow { display: grid; grid-template-columns: 5.5em minmax(0, 1fr) auto; gap: 8px; align-items: baseline; padding: 6px 10px; border-bottom: 1px solid var(--grid); color: var(--fg); text-decoration: none; }
.frow:hover { background: var(--hover); }
.frow .form { font-family: var(--num); font-weight: 600; color: var(--accent); overflow-wrap: anywhere; }
.frow .fdate { color: var(--muted); font-size: 11px; font-family: var(--num); white-space: nowrap; }

/* popover */
.pop {
  position: fixed; z-index: 50; background: var(--pop); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 12px 34px rgba(0, 0, 0, .6); padding: 8px; min-width: 210px; max-width: calc(100vw - 24px);
}
.pop h4 { margin: 4px 6px 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.menu { display: grid; gap: 2px; }
.menu button {
  display: flex; align-items: center; justify-content: space-between; gap: 16px; text-align: left;
  border: 0; background: none; padding: 9px 10px; border-radius: 6px; font-size: 14px;
}
.menu button:hover:not(:disabled) { background: var(--hover); }
.menu button:disabled { color: var(--muted); cursor: default; }
.menu button[aria-current="true"] { color: var(--accent); }
.menu .danger { color: var(--down); }
.menu small { color: var(--muted); font-size: 12px; }
.menu hr, .pop .zin > hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
.tsz { display: flex; align-items: center; gap: 6px; padding: 4px 4px 4px 10px; font-size: 14px; }
.tsz > span { flex: 1; }
.tsz button { width: 36px; height: 32px; border: 1px solid var(--line); border-radius: 6px; background: var(--head); font-size: 13px; font-weight: 600; }
.tsz button:disabled { opacity: .35; }
.tsz b { min-width: 44px; text-align: center; font-weight: 500; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.check { width: 30px; height: 18px; border-radius: 99px; background: var(--line); position: relative; flex: none; }
.check::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
.check.on { background: var(--vwap); } .check.on::after { transform: translateX(12px); }
.presets { display: grid; grid-template-columns: repeat(4, 56px); gap: 8px; padding: 0 4px 4px; }

function tradingDays(n) {

    const wd = d.getUTCDay();

    d.setUTCDate(d.getUTCDate() - 1);

    if (di < DAILY_DAYS - INTRADAY_DAYS) {
      const o = px * (1 + gauss(r) * dvol * 0.25), c = o * (1 + gauss(r) * dvol + 0.0004);
      const h = Math.max(o, c) * (1 + Math.abs(gauss(r)) * dvol * 0.4);
      const l = Math.min(o, c) * (1 - Math.abs(gauss(r)) * dvol * 0.4);
      daily.push({ time: day, open: o, high: h, low: l, close: c, volume: Math.round(4e7 * (0.6 + r())) });
      px = c;

    }
    const mins = di === DAILY_DAYS - 1 ? LIVE_START : SESSION;
    let p = px * (1 + gauss(r) * dvol * 0.25);
    const dayBars = [];
    for (let i = 0; i < mins; i++) {
      const o = p, c = o * (1 + gauss(r) * mvol);
      const h = Math.max(o, c) * (1 + Math.abs(gauss(r)) * mvol * 0.5);
      const l = Math.min(o, c) * (1 - Math.abs(gauss(r)) * mvol * 0.5);
      const shape = 1 + 12 * Math.pow(i / (SESSION - 1) - 0.5, 2);
      const spike = r() < 0.02 ? 4 + r() * 6 : 1;
      dayBars.push({ time: day + OPEN + i * 60, open: o, high: h, low: l, close: c, volume: Math.round(9e4 * shape * spike * (0.3 + r())) });
      p = c;

    daily.push(rollup(day, dayBars));

  const s = { sym, m1, daily, mvol, prevClose: daily[daily.length - 2].close, lastNew: Date.now(), dir: 'up', prints: [], book: null };

}
function rollup(time, bars) {

const dec = p => p < 1 ? 4 : p < 5 ? 3 : 2;
const roundTo = (v, inc) => Math.round(v / inc) * inc;

function requote(s) {

    const price = side === 'buy' ? s.ask : side === 'sell' ? s.bid : roundTo(p, s.inc);
    const size = Math.random() < 0.2 ? 1 + Math.floor(Math.random() * 99) : 100 * (1 + Math.floor(Math.random() * (Math.random() < 0.1 ? 50 : 5)));

function aggIntraday(m1, k) {

    if (t !== key) { cur = { ...b, time: t }; out.push(cur); key = t; }
    else { cur.high = Math.max(cur.high, b.high); cur.low = Math.min(cur.low, b.low); cur.close = b.close; cur.volume += b.volume; }
  }

}

    if (t !== key) { cur = { ...b, time: t }; out.push(cur); key = t; }
    else { cur.high = Math.max(cur.high, b.high); cur.low = Math.min(cur.low, b.low); cur.close = b.close; cur.volume += b.volume; }

    const ok = b.time > t && [b.open, b.high, b.low, b.close].every(Number.isFinite);
    if (ok) { t = b.time; if (!Number.isFinite(b.volume)) b.volume = 0; }

async function api(path, params = {}) {

  Object.entries(params).forEach(([k, v]) => { if (v != null) url.searchParams.set(k, v); });
  let r;
  try { r = await fetch(url, { headers: { 'APCA-API-KEY-ID': dataCfg.key, 'APCA-API-SECRET-KEY': dataCfg.secret } }); }
  catch (e) { throw new DataError('This page could not reach Alpaca. Either you are offline, or the page is hosted somewhere that blocks outside connections (the Claude preview does).', 'net'); }
  if (r.ok) return r.json();

  if (r.status === 403 && /subscription/i.test(body)) throw new DataError('Your Alpaca plan does not include this data.', 'plan');
  if (r.status === 401 || r.status === 403) throw new DataError('Alpaca did not accept the keys. Check the Key ID and Secret.', 'auth');

async function fetchBars(sym, timeframe, feedName, start, end) {
  const out = [];

    const j = await api(`/v2/stocks/${encodeURIComponent(sym)}/bars`, {
      timeframe, feed: feedName, adjustment: 'split', limit: 10000, page_token: page,
      start: new Date(start).toISOString(), end: end ? new Date(end).toISOString() : null

    (j.bars || []).forEach(b => out.push({ time: etSec(tms(b.t)), open: b.o, high: b.h, low: b.l, close: b.c, volume: b.v }));

  catch (e) { if (e.code !== 'plan') throw e; }

  const iex = await fetchBars(s.sym, timeframe, 'iex', sip.length ? cut : start);

    if (stores[sym] !== s) return;

    if (!off(b.high) && !off(b.low)) continue;

    const o = off(b.open) ? null : b.open, c = off(b.close) ? null : b.close;
    changed = true;
    if (o == null && c == null) { m.splice(i--, 1); continue; }  // the whole minute was bad prints

// Tabs ride in the top bar, after the Layout (edit) button, when everything fits on one line there;
// otherwise they get their own row below it.
function placeTabs() {
  const nav = document.getElementById('tabs'), bar = document.querySelector('.bar');
  if (!nav || !bar) return;
  const oneLine = () => {
    const rs = [...bar.children].map(el => el.getBoundingClientRect()).filter(r => r.width && r.height);
    return rs.every(a => rs.every(b => a.top < b.bottom));
  };
  if (nav.parentNode === bar) bar.after(nav);

function renderZoom() {
  const z = document.getElementById('zoomctl');

/* ---------- app zoom ---------- */
// "auto" picks a size from the screen width; a number is the user's own zoom level.
const SCALE_KEY = 'multichart-scale-v1', ZMIN = 0.5, ZMAX = 2;
let scalePref = 'auto';
try { const v = JSON.parse(localStorage.getItem(SCALE_KEY)); if (v === 'auto' || typeof v === 'number') scalePref = v; } catch (e) {}

function chartFont() { return Math.round(11 * uiScale()); }
function setScale(v) {
  scalePref = v === 'auto' ? 'auto' : Math.round(Math.max(ZMIN, Math.min(ZMAX, v)) * 10) / 10;
  try { localStorage.setItem(SCALE_KEY, JSON.stringify(scalePref)); } catch (e) {}

/* ---------- the layout follows the phone ---------- */
// On a phone or tablet the layout turns with the screen: 2 across by 4 down in portrait becomes 4 across
// by 2 down in landscape and back. A grid of charts keeps its reading order; other layouts swap rows
// and columns, with Level II and Time & Sales kept side by side. Each tab remembers how it looked in
// each orientation, so going back restores your sizes.
const ROTATE_KEY = 'multichart-rotate-v1';
let rotateOn = true;
try { rotateOn = localStorage.getItem(ROTATE_KEY) !== '0'; } catch (e) {}

// How many panels the layout shows across ('h') or down ('v'). A Level II + T&S pair counts as one.
function span(n, dir) {

  return n.children.reduce((a, c) => n.dir === dir ? a + span(c, dir) : Math.max(a, span(c, dir)), 0);

// The layout as rows of charts, if it is an even grid made only of charts.
function chartGrid(root) {

  const rows = root.dir === 'v' ? root.children.map(r => isLeaf(r) ? [r] : r.children.every(isLeaf) ? r.children : null)
    : root.children.every(isLeaf) ? [root.children] : null;
  if (!rows || rows.some(r => !r) || rows.some(r => r.length !== rows[0].length) || rows.flat().some(c => c.kind !== 'chart')) return null;
  return rows;
}
// Swap rows and columns. A turned layout starts with charts at equal sizes and panels a bit smaller.
function turn(n) {
  if (isLeaf(n)) return n;
  if (isPair(n)) { n.dir = 'h'; return n; }

  kids.forEach(k => {

    k.size = cells.some(c => c.kind === 'chart') || (dir === 'h' && (isPair(k) || cells.some(c => c.kind === 'lts' || c.kind === 'fund'))) ? 1 : 0.6;

const popWins = {}, wantBack = new Set(), watching = new Set();
let dropLead = null, seeking = false;
// The first window to get the lock holds the live connection until it closes or steps aside.
function seekLead() {
  if (leader || seeking || held || !bus || !navigator.locks) return;
  seeking = true;
  navigator.locks.request('multichart-stream', () => new Promise(done => {
    seeking = false;
    if (held) return done();
    dropLead = done; leader = true;
    setFeed(isLive() ? 'connecting' : 'demo');
    syncStream();
  }));
}
function stepDown() {
  if (dropLead) { dropLead(); dropLead = null; }
  if (bus && navigator.locks) leader = false;
}
if (bus) bus.onmessage = e => {
  const m = e.data || {};
  if (m.t === 'want' && leader) {
    if (!remote.has(m.from)) post({ t: 'feed', state: feed.state, msg: feed.msg });  // a new window: tell it how things stand
    remote.set(m.from, { charts: m.charts || [], watch: m.watch || [], at: Date.now() });
    syncStream();
  } else if (m.t === 'schwab' && !leader) (m.data || []).forEach(onSchwabData);
  else if (m.t === 'alpaca' && !leader) (m.msgs || []).forEach(onAlpaca);
  else if (m.t === 'feed' && !leader && !held) {
    leaderFeed = m.state;
    // This window's own loading problems still show; otherwise it reports the leader's connection.
    const bad = m.state === 'live' && Object.values(stores).find(x => x.error && x.errCode !== 'empty');
    if (isLive()) setFeed(bad ? 'error' : m.state, bad ? bad.error : m.msg);
  }
  else if (m.t === 'close-tab' && m.id === popTab) window.close();
  else if (m.t === 'focus' && m.id === popTab) window.focus();
  else if (m.t === 'tab-open' && !popTab && tabs.some(t => t.id === m.id)) {
    outTabs.add(m.id); watchTab(m.id);
    if (state.id === m.id && !noTabs) leaveTab(); else renderTabs();
  }
};
// The main window steps off a tab that went to another window.
function leaveTab() {
  const i = tabs.findIndex(t => owns(t.id));
  if (i >= 0) switchTab(i); else { noTabs = true; render(); }
}
// A popped-out window holds its tab's lock while it is open; once the lock comes free, the tab is back.
function watchTab(id) {
  if (watching.has(id) || !navigator.locks) return;
  watching.add(id);
  navigator.locks.request('multichart-tab-' + id, () => {
    watching.delete(id); outTabs.delete(id); delete popWins[id];
    const i = tabs.findIndex(t => t.id === id);
    if (i >= 0 && (noTabs || wantBack.has(id))) switchTab(i); else renderTabs();
    wantBack.delete(id);
  });
}
function popOut(i, restoring) {
  const t = tabs[i], w = Math.round(Math.min(screen.availWidth, outerWidth) * 0.8), h = Math.round(Math.min(screen.availHeight, outerHeight) * 0.8);
  // With more than one monitor, ask once to place windows on any of them, so they come back where they were.
  if (!restoring && screen.isExtended && window.getScreenDetails) getScreenDetails().catch(() => {});
  save();
  const at = t.win ? `width=${t.win.w},height=${t.win.h},left=${t.win.x},top=${t.win.y}` : `width=${w},height=${h},left=${screenX + 60},top=${screenY + 60}`;
  const win = open(location.pathname + '?win=' + encodeURIComponent(t.id), 'multichart-' + t.id, 'popup,' + at);
  if (!win) return restoring ? false : toast('The browser blocked the new window. Allow pop-ups for this site, then try again.');
  popWins[t.id] = win; outTabs.add(t.id);
  // If the window never opens properly, the tab comes back here.
  setTimeout(() => { if (outTabs.has(t.id) && !watching.has(t.id)) { outTabs.delete(t.id); renderTabs(); } }, 15000);
  if (i === activeTab) leaveTab(); else renderTabs();
  return true;
}
if (popTab) {
  document.title = state.name + ' · Multichart';
  if (navigator.locks) navigator.locks.request('multichart-tab-' + popTab, () => { post({ t: 'tab-open', id: popTab }); return new Promise(() => {}); });
} else if (bus && navigator.locks) navigator.locks.query().then(q => {
  (q.held || []).forEach(l => {
    const id = (/^multichart-tab-(.+)$/.exec(l.name) || [])[1];
    if (id && tabs.some(t => t.id === id)) { outTabs.add(id); watchTab(id); }
  });
  if (!owns(state.id)) leaveTab(); else renderTabs();
}).catch(() => {});

// Closing the main window closes the popped-out ones too, and opening it again brings them back
// where they were, on whichever monitor. Each popped-out window keeps its spot on its tab (tab.win).
const POPPED_KEY = 'multichart-popped-v1';
if (popTab && canPopOut) {
  let lastPos = '';
  const notePos = () => {
    const t = tabs.find(x => x.id === popTab);
    const pos = { x: screenX, y: screenY, w: outerWidth, h: outerHeight }, k = JSON.stringify(pos);
    if (!t || k === lastPos) return;
    lastPos = k; t.win = pos; save();
  };
  // A browser that can't place a window on another monitor puts it on this one; move it there now.
  const t = tabs.find(x => x.id === popTab);
  if (t && t.win && (screenX !== t.win.x || screenY !== t.win.y)) try { moveTo(t.win.x, t.win.y); resizeTo(t.win.w, t.win.h); } catch (e) {}
  setTimeout(() => { notePos(); setInterval(notePos, 2000); addEventListener('resize', notePos); addEventListener('pagehide', notePos); }, 1500);
} else if (canPopOut) {
  addEventListener('pagehide', () => {
    const ids = [...outTabs].filter(id => tabs.some(t => t.id === id));
    try { if (ids.length) localStorage.setItem(POPPED_KEY, JSON.stringify(ids)); } catch (e) {}
    ids.forEach(id => { const w = popWins[id]; if (w && !w.closed) w.close(); post({ t: 'close-tab', id }); });
  });
  let popped = [];
  try { popped = JSON.parse(localStorage.getItem(POPPED_KEY)) || []; } catch (e) {}
  // Wait for the windows that just closed to let go of their tabs first.
  if (popped.length) setTimeout(async () => {
    try { if ((await navigator.permissions.query({ name: 'window-management' })).state === 'granted') await getScreenDetails(); } catch (e) {}
    const left = popped.filter(id => tabs.some(t => t.id === id) && !outTabs.has(id) && !popOut(tabs.findIndex(t => t.id === id), true));
    try { if (left.length) localStorage.setItem(POPPED_KEY, JSON.stringify(left)); else localStorage.removeItem(POPPED_KEY); } catch (e) {}
    if (left.length) toast(`The browser blocked ${left.length === 1 ? 'a popped-out tab' : left.length + ' popped-out tabs'} from reopening. Click the blocked pop-up icon in the address bar, choose <b>Always allow</b>, then reload.`, true);
  }, 1200);
}

// What one window saves, the others pick up.
addEventListener('storage', e => {
  if (!e.key || !e.key.startsWith('multichart-') || held) return;
  let j = null;
  try { j = JSON.parse(e.newValue); } catch (err) {}
  const charts = () => tiles.forEach(t => t.chart && t.syncLines());
  switch (e.key) {
    case TABS_KEY: mergeTabs(j); break;
    case ALERT_KEY: alerts = Array.isArray(j) ? j : []; paintBell(); charts(); break;
    case DRAW_KEY: drawings = j && typeof j === 'object' ? j : {}; charts(); break;
    case WL_KEY: if (j && Array.isArray(j.lists)) { wlists = j.lists.filter(l => l && l.id && Array.isArray(l.syms)); paintLists(); } break;
    case COLOR_KEY: colors = j && typeof j === 'object' ? j : {}; applyColors(); break;
    case SCALE_KEY: if (j === 'auto' || typeof j === 'number') { scalePref = j; applyScale(); } break;
    case SAVED_KEY: savedLayouts = Array.isArray(j) ? j : []; break;
    case ZOOM_KEY: zoomMode = e.newValue === 'highlight' ? 'highlight' : 'pinch'; tiles.forEach(t => t.chart && t.applyZoomMode()); break;
    case VOLSEP_KEY: if ((e.newValue === '1') !== volSep) { volSep = !volSep; for (const [id, t] of tiles) if (t.chart) { t.destroy(); tiles.delete(id); } render(); } break;
    case ROTATE_KEY: rotateOn = e.newValue !== '0'; break;
    case DATA_KEY: location.reload(); break;  // a new data source or sign-in: start over with it
  }
});

// Installing: Chrome and Edge offer it through the menu here; Safari on a Mac has File → Add to Dock.
let installAsk = null;
const installed = () => matchMedia('(display-mode: standalone), (display-mode: fullscreen), (display-mode: minimal-ui)').matches || navigator.standalone;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); installAsk = e; });
addEventListener('appinstalled', () => { installAsk = null; toast('Multichart is installed. Open it from your Start menu, Dock or desktop.'); });
function installApp() {
  if (installAsk) { installAsk.prompt(); installAsk.userChoice.finally(() => { installAsk = null; }); return; }
  toast(/Mac/.test(navigator.platform) && /Safari/.test(navigator.userAgent) && !/Chrome|Chromium|Edg/.test(navigator.userAgent)
    ? 'In Safari, choose <b>File → Add to Dock</b> to install Multichart.'
    : 'In Chrome or Edge, click the install icon at the right end of the address bar, or open the browser menu and choose <b>Install Multichart</b> (in Chrome it is under <b>Cast, save and share</b>).', true);
}

/* ---------- go ---------- */
// Which side the camera cutout is on: the top of the phone points left at 90 degrees, right at 270.
function markCutout() {
  const a = screen.orientation ? screen.orientation.angle : (window.orientation || 0);
  const root = document.documentElement;
  root.classList.toggle('cut-left', a === 90);
  root.classList.toggle('cut-right', a === 270 || a === -90);
}
markCutout();
if (screen.orientation) screen.orientation.addEventListener('change', markCutout);
window.addEventListener('orientationchange', markCutout);
window.addEventListener('resize', markCutout);
orientLayout();
render();
setFeed(isLive() ? 'connecting' : 'demo');
seekLead();
syncStream();
// A new device only lacks the app password (or its settings): open the data panel right away.
if (dataCfg.mode === 'schwab' && !dataCfg.pass) openData();
// The app's heartbeat: prices, panels and alerts. A floating picture of the tab is redrawn with it.
let lastBeat = 0;
function beat() {
  lastBeat = Date.now();
  if (held) return;
  if (isLive()) {
    wanted().forEach(sym => { const s = store(sym); if (ready(s)) requote(s); });
    syncStream();
    // Watchlist prices stream from Schwab; a fresh batch now and then fills any gaps.
    if (Date.now() - quotesAt > (dataCfg.mode === 'schwab' && streamUp() ? 120e3 : 15e3)) refreshQuotes();
  } else new Set([...wanted(), ...watchSyms()]).forEach(sym => tick(store(sym)));
  tiles.forEach(t => t.update());
  if (leader) checkAlerts();  // one window watches the alerts, so a hit beeps once
  if (vp.on) paintPip();
}
setInterval(beat, 700);
if (vidPip) setTimeout(pipFeed, 1000);
setInterval(backfill, 60000);
// Fundamentals panels check for fresh news and update "5m ago" times once a minute.
setInterval(() => tiles.forEach(t => t.kind === 'fund' && t.paintFund()), 60000);
})();
</script>
