<title>Multichart</title>
<!-- Added to the Home Screen, the app opens full screen without Safari's bars. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Multichart">
<meta name="theme-color" content="#050608">
<!-- width=980 is what iPhone uses for pages without this tag, so the layout stays as it was;
     viewport-fit=cover lets the page reach into the sides of the screen in landscape. -->
<meta name="viewport" content="width=980, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
/* Layout: full-screen dark trading workspace (single deliberate dark look).
   Thin top bar, then rows of tiles (chart / Level II / Time & Sales) with draggable splitters. */
:root {
  color-scheme: dark;
  --bg: #050608;
  --panel: #0b0d10;
  --head: #14171c;
  --line: #262b33;
  --grid: #14181d;
  --fg: #e4e8ec;
  --muted: #8a95a1;
  --accent: #4f8cff;
  --up: #23c26b;
  --down: #f2545b;
  --vwap: #e45cf0;
  --ext: #9aa4b0;
  --pop: #171b21;
  --chart-bg: #0b0d10;
  --l2-1: #f5d90a; --l2-2: #35c46a; --l2-3: #3aa0ff; --l2-4: #ff7eb6; --l2-5: #b98cff; --l2-6: #8f9aa6;
  --l2-text: #050608;
  --ts-buy: #23c26b; --ts-sell: #f2545b; --ts-mid: #e4e8ec;
  --draw: #f0b429; --alert: #ff8a3d;
  --scale: 1;
  --hover: color-mix(in srgb, var(--fg) 12%, transparent);
  --ui: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
  --num: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
html { height: 100%; box-sizing: border-box; }
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: inherit; }
body {
  height: 100%; background: var(--bg); color: var(--fg); font-family: var(--ui);
  display: flex; flex-direction: column; overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: max(8px, calc(env(safe-area-inset-bottom, 0px) - 8px));
  -webkit-tap-highlight-color: transparent;
}
/* Phone in landscape: iPhone reserves the same margin on both sides, but the camera cutout is on
   only one. Fill the other side, and come close to the cutout without going under it. */
html.cut-left body { padding-left: max(16px, calc(env(safe-area-inset-left, 0px) - 10px)); padding-right: 20px; }
html.cut-right body { padding-right: max(16px, calc(env(safe-area-inset-right, 0px) - 10px)); padding-left: 20px; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

/* top bar */
.bar { display: flex; align-items: center; gap: 8px; padding-block: 8px; min-width: 0; }
/* when the buttons no longer fit, they wrap onto a second line, lined up on the right under Colors */
.bar { flex-wrap: wrap; justify-content: flex-end; row-gap: 6px; } .bar > * { flex-shrink: 0; }
.brand { font-weight: 700; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; }
.brand span { color: var(--accent); }
.feed {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 8px; border-radius: 99px;
  border: 1px solid var(--line); color: var(--muted); font-size: 10px; font-weight: 600;
  letter-spacing: .08em; text-transform: uppercase; white-space: nowrap;
}
.feed i { width: 7px; height: 7px; border-radius: 50%; background: #e0a526; animation: pulse 1.6s ease-in-out infinite; }
button.feed { background: none; height: 26px; cursor: pointer; }
button.feed:hover { background: var(--hover); color: var(--fg); }
.feed[data-state="connecting"] i { background: #2fa7e0; }
.feed[data-state="live"] i { background: #2fae5d; }
.feed[data-state="live"] { color: var(--fg); }
.feed[data-state="error"] i { background: #e8644f; animation: none; }
@keyframes pulse { 50% { opacity: .3; } }
.spacer { flex: 1; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 11px;
  border-radius: 7px; border: 1px solid var(--line); background: var(--head);
  font-weight: 600; font-size: 13px; white-space: nowrap;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn svg { width: 16px; height: 16px; flex: none; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; height: 32px; }
.seg button { border: 0; background: var(--head); padding: 0 10px; font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--hover); color: var(--fg); }
@media (max-width: 560px) { .btn .lbl, .feed .lbl, .seg .lbl { display: none; } .btn { padding: 0 9px; } .brand { font-size: 14px; } }

/* grid */
.grid { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.box { display: flex; min-height: 0; min-width: 0; }
.box.h { flex-direction: row; } .box.v { flex-direction: column; }
.grid > * { min-height: 0; }
.tile {
  min-width: 0; min-height: 0; display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line); border-radius: 3px; overflow: hidden;
  container-type: inline-size;
}
.split { flex: none; position: relative; touch-action: none; }
.split.h { height: 8px; cursor: row-resize; }
.split.v { width: 8px; cursor: col-resize; }
.split::after { content: ""; position: absolute; border-radius: 2px; background: var(--line); transition: background .15s; }
.split.h::after { left: 50%; top: 2px; width: 34px; height: 4px; margin-left: -17px; }
.split.v::after { top: 50%; left: 2px; height: 34px; width: 4px; margin-top: -17px; }
.split:hover::after, .split.drag::after { background: var(--accent); }
.tile { position: relative; container-type: size; }
.btn[aria-pressed="true"] { background: var(--up); border-color: var(--up); }
@media (max-width: 560px) { #editBtn[aria-pressed="true"] .lbl { display: inline; } }

/* edit layout overlay */
.edit {
  position: absolute; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center;
  background: rgba(5, 8, 12, .78); border: 2px dashed var(--accent); border-radius: 3px;
}
.grid.editing .edit { display: flex; }
.edit .mid { display: grid; gap: 6px; justify-items: center; text-align: center; padding: 0 44px; }
.edit .what { font-weight: 700; font-size: 14px; }
.edit .what small { display: block; font-family: var(--num); font-weight: 500; font-size: 11px; color: var(--muted); }
.edit .acts { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
.edit .acts button { border: 1px solid var(--line); background: var(--head); border-radius: 6px; padding: 5px 9px; font-size: 12px; font-weight: 600; }
.edit .acts .danger { color: var(--down); }
.edit .acts button:disabled { opacity: .4; cursor: default; }
.side-add {
  position: absolute; width: 34px; height: 34px; border-radius: 50%; border: 0; background: var(--accent); color: #fff;
  display: grid; place-items: center; box-shadow: 0 2px 10px rgba(0, 0, 0, .5); padding: 0;
}
.side-add svg { width: 16px; height: 16px; }
.side-add[data-side="top"] { top: 6px; left: 50%; margin-left: -17px; }
.side-add[data-side="bottom"] { bottom: 6px; left: 50%; margin-left: -17px; }
.side-add[data-side="left"] { left: 6px; top: 50%; margin-top: -17px; }
.side-add[data-side="right"] { right: 6px; top: 50%; margin-top: -17px; }
@container (max-width: 200px) { .edit .what small { display: none; } .edit .mid { padding: 0 40px; } }
@container (max-height: 200px) {
  .edit .what { display: none; }
  .side-add { width: 28px; height: 28px; }
  .side-add[data-side="top"], .side-add[data-side="bottom"] { margin-left: -14px; }
  .side-add[data-side="left"], .side-add[data-side="right"] { margin-top: -14px; }
  .side-add[data-side="top"] { top: 4px; } .side-add[data-side="bottom"] { bottom: 4px; }
  .side-add[data-side="top"], .side-add[data-side="bottom"] { left: 18%; }
}
@container (max-height: 130px) { .edit .mid { display: none; } .side-add[data-side="top"], .side-add[data-side="bottom"] { left: 50%; } }
@container (max-width: 150px) { .edit .mid { display: none; } }

/* tile header */
.th {
  display: flex; align-items: center; gap: 6px; padding: 3px 3px 3px 4px; min-width: 0; flex: none;
  background: var(--head); border-bottom: 1px solid var(--line); font-family: var(--num); font-variant-numeric: tabular-nums;
}
.sym {
  border: 1px solid var(--line); background: var(--panel); padding: 2px 4px 2px 6px; border-radius: 3px;
  font-family: var(--ui); font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 4px;
  white-space: nowrap; min-width: 62px; justify-content: space-between;
}
.sym svg { width: 9px; height: 9px; color: var(--muted); }
.link {
  width: 18px; height: 18px; flex: none; border-radius: 3px; border: 1px dashed var(--line); background: none;
  font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0; color: var(--muted);
}
.link.on { border: 0; color: #fff; }
.last { font-size: 15px; font-weight: 700; white-space: nowrap; }
.last.up { color: var(--up); } .last.down { color: var(--down); }
.stack { display: grid; font-size: 10.5px; line-height: 1.2; white-space: nowrap; }
.chg.up { color: var(--up); } .chg.down { color: var(--down); }
.ba b { font-weight: 500; }
.ba .bid { color: var(--down); } .ba .ask { color: var(--up); }
.name { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
@container (max-width: 470px) { .ba { display: none; } }
@container (max-width: 330px) { .chg { display: none; } }
@container (max-width: 230px) { .last { font-size: 13px; } .link { display: none; } }
.tf {
  margin-left: auto; height: 24px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel);
  font-family: var(--num); font-size: 12px; font-weight: 600; padding: 0 2px;
}
.ib { width: 26px; height: 24px; flex: none; border: 0; background: none; border-radius: 4px; display: grid; place-items: center; color: var(--muted); }
.ib:hover { background: var(--hover); color: var(--fg); }
.ib svg { width: 16px; height: 16px; }
.body { flex: 1; min-height: 0; position: relative; }
.legend {
  position: absolute; left: 8px; top: 5px; z-index: 3; pointer-events: none;
  font-family: var(--num); font-size: 11px; color: var(--muted);
}
.legend b { font-weight: 500; color: var(--vwap); }

/* Level II and Time & Sales */
.msg { position: absolute; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center; text-align: center; padding: 12px; color: var(--muted); font-size: 13px; zoom: var(--scale); pointer-events: none; }
.msg.err { color: var(--fg); }
.simnote { position: sticky; top: 0; z-index: 1; padding: 2px 6px; font-family: system-ui, sans-serif; font-size: 10px; color: var(--muted); background: var(--head); border-bottom: 1px solid var(--line); }
.tbl { position: absolute; inset: 0; overflow: auto; font-family: var(--num); font-size: 12px; font-variant-numeric: tabular-nums; }
.book { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--line); min-height: 100%; }
.side { background: var(--panel); }
.r { display: grid; grid-template-columns: minmax(0, 1fr) 7ch 7ch; gap: 6px; padding: 2px 6px; white-space: nowrap; }
.r > span { overflow: hidden; text-overflow: ellipsis; }
.r > span + span { text-align: right; }
.r.hd { position: sticky; top: 0; background: var(--head); color: var(--muted); font-family: var(--ui); font-size: 11px; font-weight: 600; z-index: 1; }
.book .r:not(.hd) { color: var(--l2-text); border-bottom: 1px solid color-mix(in srgb, var(--l2-text) 18%, transparent); }
.lv0 { background: var(--l2-1); } .lv1 { background: var(--l2-2); } .lv2 { background: var(--l2-3); }
.lv3 { background: var(--l2-4); } .lv4 { background: var(--l2-5); } .lv5 { background: var(--l2-6); }
.book .lv0 { font-weight: 600; }
.tape .r { grid-template-columns: 9ch minmax(0, 1fr) 7ch; border-bottom: 1px solid var(--grid); }
.tape .buy { color: var(--ts-buy); } .tape .sell { color: var(--ts-sell); } .tape .mid { color: var(--ts-mid); }
.tape .big { font-weight: 700; }
@container (max-width: 380px) {
  .book .r { grid-template-columns: minmax(0, 1fr) auto; gap: 4px; padding: 2px 4px; font-size: 10.5px; }
  .book .r > span:first-child { display: none; }
  .book .r > span + span { text-align: left; }
  .book .r > span:last-child { text-align: right; }
  .tape .r { grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px; padding: 2px 4px; font-size: 11px; }
}

/* popover */
.pop {
  position: fixed; z-index: 50; background: var(--pop); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 12px 34px rgba(0, 0, 0, .6); padding: 8px; min-width: 210px; max-width: calc(100vw - 24px);
}
.pop h4 { margin: 4px 6px 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.menu { display: grid; gap: 2px; }
.menu button {
  display: flex; align-items: center; justify-content: space-between; gap: 16px; text-align: left;
  border: 0; background: none; padding: 9px 10px; border-radius: 6px; font-size: 14px;
}
.menu button:hover:not(:disabled) { background: var(--hover); }
.menu button:disabled { color: var(--muted); cursor: default; }
.menu button[aria-current="true"] { color: var(--accent); }
.menu .danger { color: var(--down); }
.menu small { color: var(--muted); font-size: 12px; }
.menu hr, .pop .zin > hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }
.check { width: 30px; height: 18px; border-radius: 99px; background: var(--line); position: relative; flex: none; }
.check::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
.check.on { background: var(--vwap); } .check.on::after { transform: translateX(12px); }
.presets { display: grid; grid-template-columns: repeat(4, 56px); gap: 8px; padding: 0 4px 4px; }
.preset { width: 56px; height: 52px; padding: 4px; border: 1px solid var(--line); border-radius: 6px; background: none; display: flex; flex-direction: column; gap: 2px; }
.preset:hover { border-color: var(--accent); }
.preset div { display: flex; gap: 2px; }
.preset span { flex: 1; border-radius: 1.5px; background: #5d6875; }
.preset span.l { background: var(--l2-1); } .preset span.t { background: #3a4552; }
.symform { display: flex; gap: 6px; padding: 0 4px 8px; }
.symform input {
  flex: 1; min-width: 0; height: 36px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px;
  background: var(--panel); font-family: var(--num); font-weight: 600; text-transform: uppercase; font-size: 16px;
}
.picks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 0 4px 4px; }
.picks button { border: 1px solid var(--line); background: none; border-radius: 6px; padding: 6px 0; font-family: var(--num); font-size: 12px; font-weight: 600; }
.picks button:hover { border-color: var(--accent); }
.note { margin: 6px 6px 2px; font-size: 12px; color: var(--muted); max-width: 250px; line-height: 1.4; }
/* workspace tabs */
.tabs { display: flex; gap: 4px; padding-bottom: 6px; overflow-x: auto; scrollbar-width: none; flex: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button {
  flex: none; display: inline-flex; align-items: center; gap: 5px; height: 28px; padding: 0 12px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--head); color: var(--muted); font-size: 12px; font-weight: 600; white-space: nowrap;
}
.tabs button[aria-current="true"] { color: var(--fg); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--head)); }
.tabs button svg { width: 9px; height: 9px; }
.tabs .addtab { padding: 0 10px; font-size: 15px; }
/* tabs moved up into the top bar when it all fits on one line (the bar is already zoomed) */
.bar > .tabs { zoom: 1; padding-bottom: 0; }
.zoomctl { display: inline-flex; flex: none; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; height: 32px; background: var(--head); }
.zoomctl button { border: 0; background: none; height: 30px; padding: 0 10px; font-size: 16px; font-weight: 600; display: inline-flex; align-items: center; }
.zoomctl button:hover:not(:disabled) { background: var(--hover); }
.zoomctl .zlabel { font-size: 11px; min-width: 50px; justify-content: center; font-variant-numeric: tabular-nums; color: var(--muted); padding: 0 4px; border-inline: 1px solid var(--line); }
.zoomctl button:disabled { opacity: .35; cursor: default; }
@media (max-width: 560px) {
  .bar { gap: 5px; } .feed { padding: 3px 7px; } .seg button { padding: 0 8px; }
  .zoomctl button { padding: 0 8px; } .zoomctl .zlabel { min-width: 38px; font-size: 10px; }
}

/* app zoom: scale the interface text and controls; chart canvases stay at native size and scale their own text */
.bar, .tabs, .th, .tbl, .legend, .hint, .edit .mid, .side-add, .zin, .toast { zoom: var(--scale); }

/* drawings, alerts, saved layouts */
.draw-layer { position: absolute; inset: 0; z-index: 2; pointer-events: none; width: 100%; height: 100%; }
.hint {
  position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%); z-index: 4; display: flex; align-items: center; gap: 10px;
  background: var(--pop); border: 1px solid var(--accent); border-radius: 99px; padding: 5px 6px 5px 12px; font-size: 12px; white-space: nowrap;
  box-shadow: 0 6px 20px rgba(0, 0, 0, .4); max-width: calc(100% - 16px);
}
.hint span { overflow: hidden; text-overflow: ellipsis; }
.hint button { border: 0; background: var(--head); border-radius: 99px; padding: 4px 10px; font-size: 12px; font-weight: 600; }
.tile.drawing .body { cursor: crosshair; }
/* highlight to zoom */
.tile.hlzoom .body { touch-action: none; }
.hlband { position: absolute; top: 0; z-index: 3; pointer-events: none; background: color-mix(in srgb, var(--accent) 18%, transparent); border-inline: 1px solid var(--accent); }
.zoomreset {
  position: absolute; top: 6px; z-index: 5; height: calc(24px * var(--scale)); padding: 0 calc(9px * var(--scale)); border-radius: 6px;
  border: 1px solid var(--line); background: var(--head); font-size: calc(12px * var(--scale)); font-weight: 600;
}
#settingsBtn .caret { width: 9px; height: 9px; color: var(--muted); }
.bell { position: relative; }
.badge {
  position: absolute; top: -5px; right: -5px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 99px;
  background: var(--alert); color: #111; font-size: 10px; font-weight: 700; display: grid; place-items: center;
}
.alist { display: grid; gap: 2px; max-height: 240px; overflow: auto; margin: 0 2px 8px; }
.arow { display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 6px; font-size: 13px; background: var(--head); }
.arow b { font-family: var(--num); }
.arow .st { margin-left: auto; font-size: 11px; color: var(--muted); white-space: nowrap; }
.arow .st.hit { color: var(--alert); font-weight: 600; }
.arow button { border: 0; background: none; color: var(--muted); padding: 2px 4px; font-size: 15px; line-height: 1; }
.aform { display: flex; gap: 6px; padding: 0 2px 4px; }
.aform input {
  min-width: 0; height: 34px; padding: 0 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel);
  font-family: var(--num); font-size: 15px;
}
.aform input.s { width: 76px; text-transform: uppercase; } .aform input.p { flex: 1; }
.empty { margin: 0 6px 10px; font-size: 13px; color: var(--muted); }
.saved { display: grid; gap: 2px; margin: 0 2px 8px; max-height: 200px; overflow: auto; }
.saved .srow { display: flex; align-items: center; gap: 4px; }
.saved .srow > button:first-child {
  flex: 1; text-align: left; border: 0; background: var(--head); border-radius: 6px; padding: 8px 10px; font-size: 14px; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.saved .srow > button:first-child:hover { background: var(--hover); }
.saved .srow > button + button { border: 0; background: none; color: var(--muted); padding: 6px; font-size: 15px; }
.toasts {
  position: fixed; z-index: 70; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  display: grid; gap: 8px; width: min(380px, calc(100vw - 32px));
}
.toast {
  display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; background: var(--pop);
  border: 1px solid var(--alert); box-shadow: 0 10px 30px rgba(0, 0, 0, .5); font-size: 14px; cursor: pointer;
}
.toast i { width: 10px; height: 10px; border-radius: 50%; background: var(--alert); flex: none; }
.toast b { font-family: var(--num); }

/* colors sheet */
.sheet {
  position: fixed; z-index: 60; top: 0; right: 0; bottom: 0; width: min(calc(360px * var(--scale)), 100vw); overflow: auto;
  background: var(--pop); border-left: 1px solid var(--line); box-shadow: -12px 0 34px rgba(0, 0, 0, .45);

<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<script>
(() => {
/* ---------- demo market data ---------- */
const TF = { '1m': 1, '2m': 2, '5m': 5, '15m': 15, '30m': 30, '1h': 60, 'D': 'D', 'W': 'W' };
const OPEN = 9 * 3600 + 30 * 60;           // 9:30 ET, stored as wall-clock seconds
const SESSION = 390;                        // minutes per regular session
const CLOSE = 16 * 3600;                    // 4:00 PM ET
const isExt = t => { const sec = t % 86400; return sec < OPEN || sec >= CLOSE; };  // pre-market or after-hours bar
const INTRADAY_DAYS = 10, DAILY_DAYS = 260, LIVE_START = 200;
const BASE = { SPY: 580, QQQ: 505, IWM: 225, DIA: 425, AAPL: 232, MSFT: 425, NVDA: 138, TSLA: 252, AMZN: 188, META: 575, GOOGL: 165, AMD: 155, GLD: 368, UWMC: 1.42, IAUX: 1.46, HGRAF: 2.45 };
const NAMES = { SPY: 'SPDR S&P 500 ETF', QQQ: 'Invesco QQQ Trust', IWM: 'iShares Russell 2000', DIA: 'SPDR Dow Jones ETF', AAPL: 'Apple Inc', MSFT: 'Microsoft Corp', NVDA: 'NVIDIA Corp', TSLA: 'Tesla Inc', AMZN: 'Amazon.com Inc', META: 'Meta Platforms', GOOGL: 'Alphabet Inc', AMD: 'Advanced Micro Devices', GLD: 'SPDR Gold Shares', UWMC: 'UWM Holdings', IAUX: 'i-80 Gold Corp', HGRAF: 'HighGold Mining' };
const PICKS = ['SPY', 'QQQ', 'IWM', 'AAPL', 'NVDA', 'TSLA', 'AMD', 'META', 'GLD', 'UWMC', 'IAUX', 'HGRAF'];
const VENUES = ['NSDQ', 'ARCA', 'NYSE', 'EDGX', 'BATS', 'IEX', 'MEMX', 'CBOE', 'MF/MM', 'OTC OTH', 'CHXE'];
const LINK_COLORS = ['', '#e0a526', '#2fa7e0', '#e8644f', '#2fae5d', '#9b6cf0'];

function rng(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function gauss(r) { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
const pick = a => a[Math.floor(Math.random() * a.length)];

function tradingDays(n) {
  const out = [], d = new Date();
  d.setUTCHours(0, 0, 0, 0);
  while (out.length < n) {
    const wd = d.getUTCDay();
    if (wd !== 0 && wd !== 6) out.unshift(d.getTime() / 1000);
    d.setUTCDate(d.getUTCDate() - 1);
  }
  return out;
}

let stores = {};
function store(sym) { return stores[sym] || (isLive() ? liveStore(sym) : demoStore(sym)); }
const ready = s => s.ready !== false;
function demoStore(sym) {
  const r = rng(hash(sym));
  const days = tradingDays(DAILY_DAYS);
  const dvol = 0.011 + r() * 0.014, mvol = dvol / Math.sqrt(SESSION);
  const base = BASE[sym] ?? (20 + r() * 280);
  let px = base * (0.82 + r() * 0.2);
  const daily = [], m1 = [];
  days.forEach((day, di) => {
    if (di < DAILY_DAYS - INTRADAY_DAYS) {
      const o = px * (1 + gauss(r) * dvol * 0.25), c = o * (1 + gauss(r) * dvol + 0.0004);
      const h = Math.max(o, c) * (1 + Math.abs(gauss(r)) * dvol * 0.4);
      const l = Math.min(o, c) * (1 - Math.abs(gauss(r)) * dvol * 0.4);
      daily.push({ time: day, open: o, high: h, low: l, close: c, volume: Math.round(4e7 * (0.6 + r())) });
      px = c;
      return;
    }
    const mins = di === DAILY_DAYS - 1 ? LIVE_START : SESSION;
    let p = px * (1 + gauss(r) * dvol * 0.25);
    const dayBars = [];
    for (let i = 0; i < mins; i++) {
      const o = p, c = o * (1 + gauss(r) * mvol);
      const h = Math.max(o, c) * (1 + Math.abs(gauss(r)) * mvol * 0.5);
      const l = Math.min(o, c) * (1 - Math.abs(gauss(r)) * mvol * 0.5);
      const shape = 1 + 12 * Math.pow(i / (SESSION - 1) - 0.5, 2);
      const spike = r() < 0.02 ? 4 + r() * 6 : 1;
      dayBars.push({ time: day + OPEN + i * 60, open: o, high: h, low: l, close: c, volume: Math.round(9e4 * shape * spike * (0.3 + r())) });
      p = c;
    }
    m1.push(...dayBars);
    daily.push(rollup(day, dayBars));
    px = p;
  });
  const s = { sym, m1, daily, mvol, prevClose: daily[daily.length - 2].close, lastNew: Date.now(), dir: 'up', prints: [], book: null };
  s.inc = tickSize(px);
  requote(s);
  for (let i = 0; i < 40; i++) addPrints(s, Date.now() - (40 - i) * 1500);
  return stores[sym] = s;
}
function rollup(time, bars) {
  return {
    time, open: bars[0].open, close: bars[bars.length - 1].close,
    high: Math.max(...bars.map(b => b.high)), low: Math.min(...bars.map(b => b.low)),
    volume: bars.reduce((s, b) => s + b.volume, 0)
  };
}
const tickSize = p => p < 1 ? 0.0001 : p < 5 ? 0.005 : 0.01;
const dec = p => p < 1 ? 4 : p < 5 ? 3 : 2;
const roundTo = (v, inc) => Math.round(v / inc) * inc;
const last = s => s.m1.length ? s.m1[s.m1.length - 1].close : s.daily.length ? s.daily[s.daily.length - 1].close : NaN;

function requote(s) {
  const p = last(s), inc = s.inc;
  if (s.live && s.qb > 0 && s.qa >= s.qb) { s.bid = s.qb; s.ask = s.qa; }
  else {
    const spread = Math.max(inc, roundTo(p * 0.0003, inc));
    s.bid = roundTo(p - spread / 2, inc);
    s.ask = s.bid + Math.max(inc, roundTo(spread, inc));
  }
  if (s.realBook) return;
  const lot = p < 5 ? 1000 : 100;
  const side = (top, sign) => {
    const out = [];
    for (let lv = 0; lv < 6; lv++) {
      const n = 1 + Math.floor(Math.random() * 3);
      const venues = [...VENUES].sort(() => Math.random() - 0.5).slice(0, n);
      venues.forEach(v => out.push({ ex: v, price: top + sign * lv * inc, size: lot * (1 + Math.floor(Math.random() * (lv === 0 ? 40 : 15))), lv }));
    }
    return out.sort((a, b) => a.lv - b.lv || b.size - a.size);
  };
  s.book = { bids: side(s.bid, -1), asks: side(s.ask, 1) };
}
const etTime = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
function addPrints(s, at = Date.now()) {
  const n = 1 + Math.floor(Math.random() * 3), p = last(s);
  for (let i = 0; i < n; i++) {
    const roll = Math.random();
    const side = roll < 0.42 ? 'buy' : roll < 0.84 ? 'sell' : 'mid';
    const price = side === 'buy' ? s.ask : side === 'sell' ? s.bid : roundTo(p, s.inc);
    const size = Math.random() < 0.2 ? 1 + Math.floor(Math.random() * 99) : 100 * (1 + Math.floor(Math.random() * (Math.random() < 0.1 ? 50 : 5)));
    s.prints.unshift({ t: etTime.format(at), price, size, side });
  }
  s.prints.length = Math.min(s.prints.length, 150);
}

function aggIntraday(m1, k) {
  const out = []; let cur = null, key = -1;
  for (const b of m1) {
    const day = b.time - (b.time % 86400);
    const t = day + OPEN + Math.floor((b.time - day - OPEN) / 60 / k) * k * 60;
    if (t !== key) { cur = { ...b, time: t }; out.push(cur); key = t; }
    else { cur.high = Math.max(cur.high, b.high); cur.low = Math.min(cur.low, b.low); cur.close = b.close; cur.volume += b.volume; }
  }
  return out;
}
function aggWeekly(daily) {
  const out = []; let cur = null, key = -1;
  for (const b of daily) {
    const d = Math.floor(b.time / 86400), monday = d - ((d + 4) % 7 + 6) % 7, t = monday * 86400;
    if (t !== key) { cur = { ...b, time: t }; out.push(cur); key = t; }
    else { cur.high = Math.max(cur.high, b.high); cur.low = Math.min(cur.low, b.low); cur.close = b.close; cur.volume += b.volume; }
  }
  return out;
}
function bars(sym, tf) {
  const s = store(sym), k = TF[tf];
  if (k === 'D') return s.daily.map(b => ({ ...b }));
  if (k === 'W') return aggWeekly(s.daily);
  return aggIntraday(s.m1, k);
}
function vwap(list) {
  let d = -1, pv = 0, vv = 0;
  return list.map(b => {
    const day = Math.floor(b.time / 86400);
    if (day !== d) { d = day; pv = 0; vv = 0; }
    pv += (b.high + b.low + b.close) / 3 * b.volume; vv += b.volume;
    const pt = { time: b.time, value: pv / vv };
    if (vv === b.volume && d !== -1) pt.color = 'rgba(0,0,0,0)';
    return pt;
  });
}
function tick(s) {
  const now = Date.now(), today = s.daily[s.daily.length - 1];
  const todayCount = s.m1.filter(b => b.time >= today.time).length;
  const lb = s.m1[s.m1.length - 1], before = lb.close;
  if (now - s.lastNew >= 60000 && todayCount < SESSION) {
    s.lastNew = now;
    const c = lb.close * (1 + gauss(Math.random) * s.mvol * 0.3);
    s.m1.push({ time: lb.time + 60, open: lb.close, high: Math.max(lb.close, c), low: Math.min(lb.close, c), close: c, volume: Math.round(2e4 * (0.5 + Math.random())) });
  } else {
    const c = lb.close * (1 + gauss(Math.random) * s.mvol * 0.35);
    lb.close = c; lb.high = Math.max(lb.high, c); lb.low = Math.min(lb.low, c);
    lb.volume += Math.round(1500 * Math.random());
  }
  const nb = s.m1[s.m1.length - 1];
  s.dir = nb.close >= before ? 'up' : 'down';
  today.close = nb.close; today.high = Math.max(today.high, nb.high); today.low = Math.min(today.low, nb.low);
  today.volume += 1500;
  requote(s);
  addPrints(s);
}

/* ---------- live data (Alpaca's free plan) ---------- */
// Charts use full-market (SIP) minute bars, which the free plan holds back 15 minutes;
// IEX bars and live IEX trades fill in the latest stretch until the SIP bars catch up.
// Level II stays simulated around the real IEX bid/ask: no free source has market depth.
const DATA_KEY = 'multichart-data-v1';
// George's own helper, so a new device only needs the app password (or a setup link) to go live.
const DEFAULT_HELPER = 'https://multichart-schwab.georgenehmi1.workers.dev';
let dataCfg = { mode: 'schwab', key: '', secret: '', base: '', stream: '', helper: DEFAULT_HELPER, pass: '' };
try { dataCfg = { ...dataCfg, ...JSON.parse(localStorage.getItem(DATA_KEY)) }; } catch (e) {}
if (dataCfg.mode === 'live') dataCfg.mode = 'alpaca';
// A setup link (made under Data source → Schwab) carries the helper and app password in #live=…
// The part after # never reaches a server, and it is cleared from the address bar right away.
const b64 = { enc: t => btoa(Array.from(new TextEncoder().encode(t), c => String.fromCharCode(c)).join('')).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''),
  dec: t => new TextDecoder().decode(Uint8Array.from(atob(t.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0))) };
if (location.hash.startsWith('#live=')) {
  try {
    const j = JSON.parse(b64.dec(location.hash.slice(6)));
    if (j.h && j.p) dataCfg = { ...dataCfg, mode: 'schwab', helper: j.h, pass: j.p };
    localStorage.setItem(DATA_KEY, JSON.stringify(dataCfg));
  } catch (e) {}
  try { window.history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
}
const setupLink = () => location.origin + location.pathname + '#live=' + b64.enc(JSON.stringify({ h: dataCfg.helper, p: dataCfg.pass }));
const isLive = () => dataCfg.mode === 'alpaca' ? !!dataCfg.key && !!dataCfg.secret : dataCfg.mode === 'schwab' ? !!dataCfg.helper && !!dataCfg.pass : false;
const SOURCE = { alpaca: 'IEX', schwab: 'Schwab' };
let feed = { state: 'demo', msg: '' };
function setFeed(state, msg = '') {
  feed = { state, msg };
  const el = document.getElementById('feedBtn');
  if (!el) return;
  el.dataset.state = state;
  el.querySelector('.lbl').textContent = { demo: 'Demo data', connecting: 'Connecting', live: 'Live · ' + SOURCE[dataCfg.mode], error: 'Data problem' }[state];
  placeTabs();
  el.title = msg || { demo: 'Prices are simulated. Tap to connect live data.', connecting: 'Connecting', live: 'Live prices from ' + (dataCfg.mode === 'schwab' ? 'Schwab' : 'Alpaca (IEX)'), error: '' }[state];
  const sh = document.getElementById('sheet');
  if (!sh.hidden && sh.dataset.kind === 'data') paintDataStatus();
}

const SIP_DELAY = 16 * 60e3;
const tzParts = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hourCycle: 'h23', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit' });
const tzOff = new Map();
// The app's clock is New York wall-clock time, stored as if it were UTC.
function etSec(ms) {
  const hr = Math.floor(ms / 36e5);
  let off = tzOff.get(hr);
  if (off === undefined) {
    const p = Object.fromEntries(tzParts.formatToParts(new Date(hr * 36e5)).map(x => [x.type, x.value]));
    off = Date.UTC(+p.year, p.month - 1, +p.day, +p.hour, +p.minute, +p.second) - hr * 36e5;
    tzOff.set(hr, off);
  }
  return Math.floor((ms + off) / 1000);
}
const tms = t => Date.parse(t.replace(/(\.\d{3})\d+/, '$1'));

class DataError extends Error { constructor(msg, code) { super(msg); this.code = code; } }
async function api(path, params = {}) {
  const url = new URL((dataCfg.base || 'https://data.alpaca.markets').replace(/\/+$/, '') + path);
  Object.entries(params).forEach(([k, v]) => { if (v != null) url.searchParams.set(k, v); });
  let r;
  try { r = await fetch(url, { headers: { 'APCA-API-KEY-ID': dataCfg.key, 'APCA-API-SECRET-KEY': dataCfg.secret } }); }
  catch (e) { throw new DataError('This page could not reach Alpaca. Either you are offline, or the page is hosted somewhere that blocks outside connections (the Claude preview does).', 'net'); }
  if (r.ok) return r.json();
  const body = await r.text().catch(() => '');
  if (r.status === 403 && /subscription/i.test(body)) throw new DataError('Your Alpaca plan does not include this data.', 'plan');
  if (r.status === 401 || r.status === 403) throw new DataError('Alpaca did not accept the keys. Check the Key ID and Secret.', 'auth');
  if (r.status === 429) throw new DataError('Too many requests to Alpaca. It will retry shortly.', 'rate');
  throw new DataError(`Alpaca returned an error (${r.status}).`, r.status);
}
async function fetchBars(sym, timeframe, feedName, start, end) {
  const out = [];
  let page = null, n = 0;
  do {
    const j = await api(`/v2/stocks/${encodeURIComponent(sym)}/bars`, {
      timeframe, feed: feedName, adjustment: 'split', limit: 10000, page_token: page,
      start: new Date(start).toISOString(), end: end ? new Date(end).toISOString() : null
    });
    (j.bars || []).forEach(b => out.push({ time: etSec(tms(b.t)), open: b.o, high: b.h, low: b.l, close: b.c, volume: b.v }));
    page = j.next_page_token;
  } while (page && ++n < 8);
  return out;
}
// Full-market bars up to 16 minutes ago, then IEX bars for the rest.
async function history(s, timeframe, start) {
  const cut = Date.now() - SIP_DELAY;
  let sip = [];
  try { sip = await fetchBars(s.sym, timeframe, 'sip', start, cut); }
  catch (e) { if (e.code !== 'plan') throw e; }
  if (sip.length && timeframe === '1Min') s.sipUntil = cut;
  const iex = await fetchBars(s.sym, timeframe, 'iex', sip.length ? cut : start);
  const lastT = sip.length ? sip[sip.length - 1].time : -Infinity;
  return [...sip, ...iex.filter(b => b.time > lastT)];
}

function liveStore(sym) {
  const s = stores[sym] = { sym, live: true, ready: false, m1: [], daily: [], prints: [], book: null, bid: 0, ask: 0, qb: 0, qa: 0, inc: 0.01, dir: 'up', prevClose: 0 };
  loadLive(s);
  return s;
}
async function loadLive(s) {
  const sym = s.sym;
  try {
    await (dataCfg.mode === 'schwab' ? loadSchwab(s) : loadAlpaca(s));
    if (stores[sym] !== s) return;
    scrub(s, s.m1.length - 3);  // the newest minutes, now that there is a bid/ask to compare with
    s.inc = tickSize(last(s));

  { sym: 'SPY', tf: '5m' }, { sym: 'QQQ', tf: '15m' }

  if (saved && saved.root) state = saved;
  else if (old && old.rows && old.rows.length) {
    state = { chartsOnly: !!old.chartsOnly, root: normalize({ dir: 'v', size: 1, children: old.rows.map(r => ({ dir: 'h', size: r.size, children: r.cells })) }) };
  }
  allCells().forEach(c => { if (!TF[c.tf]) c.tf = '5m'; if (!KINDS[c.kind]) c.kind = 'chart'; nextId = Math.max(nextId, +c.id.slice(1) + 1); });
} catch (e) { state = { root: null, chartsOnly: false }; }
if (!state.root) state.root = fromPreset(innerWidth < 700 ? ['c', 'c', 'lt'] : ['cc', 'cc', 'll', 'tt']);

// Workspace tabs: each tab is its own { name, root, chartsOnly }, and `state` is the open tab.
const TABS_KEY = 'multichart-tabs-v1';
let tabs = [], activeTab = 0;
try {
  const t = JSON.parse(localStorage.getItem(TABS_KEY));
  if (t && t.tabs && t.tabs.length) { tabs = t.tabs; activeTab = Math.min(t.active || 0, tabs.length - 1); }
} catch (e) {}
if (!tabs.length) tabs = [{ name: 'Tab 1', ...state }];
tabs.forEach(tab => leaves(tab.root).forEach(c => { nextId = Math.max(nextId, +c.id.slice(1) + 1); }));
state = tabs[activeTab];

function save() {
  try {
    localStorage.setItem(TABS_KEY, JSON.stringify({ tabs, active: activeTab }));
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {}
}
const visible = c => !state.chartsOnly || c.kind === 'chart';

/* ---------- render ---------- */
const grid = document.getElementById('grid');
let editing = false;
function render() {
  grid.textContent = '';
  const live = new Set();
  const place = cell => {
    let t = tiles.get(cell.id);
    if (t && t.kind !== cell.kind) { t.destroy(); tiles.delete(cell.id); t = null; }
    if (!t) { t = new Tile(cell); tiles.set(cell.id, t); }
    t.cell = cell;
    t.el.style.flex = `${cell.size} 1 0`;
    live.add(cell.id);
    return t.el;
  };
  const build = n => {
    if (isLeaf(n)) return visible(n) ? place(n) : null;
    const kids = n.children.map(c => [c, build(c)]).filter(([, el]) => el);
    if (!kids.length) return null;
    const box = document.createElement('div');
    box.className = 'box ' + n.dir;
    box.style.flex = `${n.size} 1 0`;
    const items = kids.map(([c]) => c);
    kids.forEach(([, el], i) => { if (i) box.append(splitter(n.dir === 'v' ? 'h' : 'v', items, i - 1)); box.append(el); });
    return box;
  };
  const maxCell = maxed && allCells().find(c => c.id === maxed && visible(c));
  if (!maxCell) maxed = null;
  const top = maxCell ? place(maxCell) : build(state.root);
  if (top) { top.style.flex = '1 1 0'; grid.append(top); }
  for (const [id, t] of tiles) if (!live.has(id)) { t.destroy(); tiles.delete(id); }
  tiles.forEach(t => t.paintEdit());
  grid.classList.toggle('editing', editing);
  const eb = document.getElementById('editBtn');
  eb.setAttribute('aria-pressed', String(editing));
  eb.querySelector('.lbl').textContent = editing ? 'Done' : 'Layout';
  renderTabs();
  document.getElementById('modeAll').setAttribute('aria-pressed', String(!state.chartsOnly));
  document.getElementById('modeCharts').setAttribute('aria-pressed', String(state.chartsOnly));
  save();
}

// Drag a splitter: sizes are relative weights, so hidden panels keep their share.
function splitter(kind, items, i) {
  const s = document.createElement('div');
  s.className = 'split ' + kind;
  s.setAttribute('role', 'separator');
  s.setAttribute('aria-orientation', kind === 'h' ? 'horizontal' : 'vertical');
  s.addEventListener('pointerdown', e => {
    e.preventDefault();
    s.setPointerCapture(e.pointerId);
    s.classList.add('drag');
    const vertical = kind === 'h';
    const els = [...s.parentElement.children].filter(c => !c.classList.contains('split'));
    const px = els.map(el => { const r = el.getBoundingClientRect(); return vertical ? r.height : r.width; });
    const k = items.reduce((a, it) => a + it.size, 0) / px.reduce((a, b) => a + b, 0);
    items.forEach((it, j) => { it.size = px[j] * k; });
    const a = px[i], b = px[i + 1], start = vertical ? e.clientY : e.clientX, min = vertical ? 70 : 110;
    const move = ev => {
      let d = (vertical ? ev.clientY : ev.clientX) - start;
      d = Math.max(min - a, Math.min(b - min, d));
      items[i].size = (a + d) * k; items[i + 1].size = (b - d) * k;
      els[i].style.flex = `${items[i].size} 1 0`; els[i + 1].style.flex = `${items[i + 1].size} 1 0`;
    };
    const up = () => { s.classList.remove('drag'); s.removeEventListener('pointermove', move); s.removeEventListener('pointerup', up); s.removeEventListener('pointercancel', up); save(); };
    s.addEventListener('pointermove', move);
    s.addEventListener('pointerup', up);
    s.addEventListener('pointercancel', up);
  });
  return s;
}

function toggleMax(t) { maxed = maxed === t.cell.id ? null : t.cell.id; render(); }
function setSymbol(t, sym) {
  const g = t.cell.link;
  allCells().forEach(c => { if (c === t.cell || (g && c.link === g)) c.sym = sym; });
  tiles.forEach(x => { if (x.cell === t.cell || (g && x.cell.link === g)) x.load(); });
  save();
}

// Add a panel on one side of an existing panel. Level II and Time & Sales link to the panel they sit next to.
function insertPanel(target, side, kind) {
  maxed = null;
  if (kind !== 'chart') state.chartsOnly = false;
  const charts = allCells().filter(c => c.kind === 'chart');
  const cell = kind === 'chart' ? newCell('chart', DEFAULT_CHARTS[charts.length % DEFAULT_CHARTS.length]) : newCell(kind);
  if (kind !== 'chart') {
    if (!target.link) target.link = freeLink();
    cell.link = target.link; cell.sym = target.sym;
  }
  const dir = side === 'left' || side === 'right' ? 'h' : 'v';
  const before = side === 'left' || side === 'top';
  const share = kind === 'chart' ? 1 : 0.6;
  const p = parentOf(target);
  if (p && p.dir === dir) {
    const total = target.size;
    target.size = total / (1 + share); cell.size = total * share / (1 + share);
    const i = p.children.indexOf(target);
    p.children.splice(before ? i : i + 1, 0, cell);
  } else {
    const wrap = { dir, size: target.size, children: [] };
    replaceNode(target, wrap);
    target.size = 1; cell.size = share;
    wrap.children = before ? [cell, target] : [target, cell];
  }
  render();
}
function removePanel(id) {
  if (allCells().length < 2) return;
  const cell = allCells().find(c => c.id === id), p = parentOf(cell);
  if (!p) return;
  p.children = p.children.filter(c => c !== cell);
  state.root = normalize(state.root);
  render();
}

/* ---------- popovers ---------- */
const pop = document.getElementById('pop');

function openPop(anchor, html, bind) {

}

/* ---------- workspace tabs ---------- */
function renderTabs() {
  const nav = document.getElementById('tabs');
  nav.innerHTML = tabs.map((t, i) => `<button data-tab="${i}" aria-current="${i === activeTab}">${esc(t.name)}${i === activeTab ? ICON.caret : ''}</button>`).join('') +
    '<button class="addtab" id="addTab" aria-label="New tab">+</button>';
  nav.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => {
    const i = +b.dataset.tab;
    if (i === activeTab) tabPop(b); else switchTab(i);
  });
  nav.querySelector('#addTab').onclick = () => newTab();
  renderZoom();
  placeTabs();
}
// Tabs ride in the top bar, after the Layout (edit) button, when everything fits on one line there;
// otherwise they get their own row below it.
function placeTabs() {
  const nav = document.getElementById('tabs'), bar = document.querySelector('.bar');
  if (!nav || !bar) return;
  const oneLine = () => {
    const rs = [...bar.children].map(el => el.getBoundingClientRect()).filter(r => r.width && r.height);
    return rs.every(a => rs.every(b => a.top < b.bottom));
  };
  if (nav.parentNode === bar) bar.after(nav);
  if (!oneLine()) return;
  bar.insertBefore(nav, bar.querySelector('.spacer'));
  if (!oneLine()) bar.after(nav);
}
let placeQueued = false;
addEventListener('resize', () => { if (!placeQueued) { placeQueued = true; requestAnimationFrame(() => { placeQueued = false; placeTabs(); }); } });
function renderZoom() {
  const z = document.getElementById('zoomctl');
  z.innerHTML = `<button id="zoomOut" aria-label="Zoom out" ${uiScale() <= ZMIN + 0.001 ? 'disabled' : ''}>−</button><button class="zlabel" id="zoomLabel" title="Tap to fit this screen automatically">${scalePref === 'auto' ? 'Auto' : Math.round(uiScale() * 100) + '%'}</button><button id="zoomIn" aria-label="Zoom in" ${uiScale() >= ZMAX - 0.001 ? 'disabled' : ''}>+</button>`;
  z.querySelector('#zoomOut').onclick = () => setScale(uiScale() - 0.1);
  z.querySelector('#zoomIn').onclick = () => setScale(uiScale() + 0.1);
  z.querySelector('#zoomLabel').onclick = () => setScale('auto');
}

/* ---------- app zoom ---------- */
// "auto" picks a size from the screen width; a number is the user's own zoom level.
const SCALE_KEY = 'multichart-scale-v1', ZMIN = 0.5, ZMAX = 2;
let scalePref = 'auto';
try { const v = JSON.parse(localStorage.getItem(SCALE_KEY)); if (v === 'auto' || typeof v === 'number') scalePref = v; } catch (e) {}
function autoScale() {
  const w = Math.min(innerWidth, screen.width || innerWidth);
  return w < 380 ? 0.85 : w < 520 ? 0.92 : w < 1700 ? 1 : w < 2300 ? 1.15 : 1.3;
}
function uiScale() { return scalePref === 'auto' ? autoScale() : scalePref; }
function chartFont() { return Math.round(11 * uiScale()); }
function setScale(v) {
  scalePref = v === 'auto' ? 'auto' : Math.round(Math.max(ZMIN, Math.min(ZMAX, v)) * 10) / 10;
  try { localStorage.setItem(SCALE_KEY, JSON.stringify(scalePref)); } catch (e) {}
  applyScale();
}
function applyScale() {
  document.documentElement.style.setProperty('--scale', uiScale());
  tiles.forEach(t => { if (t.chart) { t.chart.applyOptions({ layout: { fontSize: chartFont() } }); t.markKey = null; } });
  closePop();
  renderTabs();
}
addEventListener('resize', () => { if (scalePref === 'auto') applyScale(); });
function switchTab(i) {
  closePop();
  maxed = null; editing = false;
  activeTab = i; state = tabs[i];
  render();
}
function newTab(copyFrom) {
  const n = tabs.length + 1;
  let name = 'Tab ' + n;
  while (tabs.some(t => t.name === name)) name += '+';
  const tab = { name, chartsOnly: false, root: null };
  if (copyFrom) {
    tab.name = copyFrom.name + ' copy';
    tab.chartsOnly = copyFrom.chartsOnly;
    tab.root = JSON.parse(JSON.stringify(copyFrom.root));
    leaves(tab.root).forEach(c => { c.id = 'p' + nextId++; });
  }
  tabs.push(tab);
  activeTab = tabs.length - 1; state = tab;
  if (!tab.root) state.root = fromPreset(['cc', 'cc']);
  maxed = null; editing = false;
  render();
}
function tabPop(anchor) {
  openPop(anchor, `
    <h4>This tab</h4>
    <form class="symform" id="renameTab"><input id="tabName" maxlength="24" value="${esc(state.name)}" aria-label="Tab name" style="text-transform:none;font-family:var(--ui);font-weight:500"><button class="btn primary" type="submit">Rename</button></form>
    <div class="menu">
      <button data-a="dup"><span>Duplicate tab</span></button>
      <button data-a="close" class="danger" ${tabs.length < 2 ? 'disabled' : ''}><span>Close tab</span></button>
    </div>`, p => {
    p.querySelector('#renameTab').onsubmit = e => {
      e.preventDefault();
      const v = p.querySelector('#tabName').value.trim();
      if (v) { state.name = v; save(); renderTabs(); }
      closePop();
    };
    p.querySelector('[data-a=dup]').onclick = () => { closePop(); newTab(state); };
    p.querySelector('[data-a=close]').onclick = () => {
      closePop();
      tabs.splice(activeTab, 1);
      switchTab(Math.max(0, activeTab - 1));
    };
  });
}

/* ---------- saved layouts ---------- */
const SAVED_KEY = 'multichart-saved-layouts-v1';
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let savedLayouts = [];
try { savedLayouts = JSON.parse(localStorage.getItem(SAVED_KEY)) || []; } catch (e) {}
function persistSaved() { try { localStorage.setItem(SAVED_KEY, JSON.stringify(savedLayouts)); } catch (e) {} }
function loadLayout(entry) {
  const root = JSON.parse(JSON.stringify(entry.root));

/* ---------- drawings ---------- */
const DRAW_KEY = 'multichart-drawings-v1';
let drawings = {};
try { drawings = JSON.parse(localStorage.getItem(DRAW_KEY)) || {}; } catch (e) {}

function persistDrawings() { try { localStorage.setItem(DRAW_KEY, JSON.stringify(drawings)); } catch (e) {} }
function refreshSym(sym) { tiles.forEach(t => { if (t.chart && t.cell.sym === sym) t.syncLines(); }); }
function addDrawing(sym, d) { (drawings[sym] = drawings[sym] || []).push({ id: drawSeq++, ...d }); persistDrawings(); refreshSym(sym); }
function removeDrawing(sym, id) { drawings[sym] = (drawings[sym] || []).filter(d => d.id !== id); persistDrawings(); refreshSym(sym); }

function drawPop(anchor, t) {

    <p class="note">Drawings belong to the symbol, so they show on every ${esc(sym)} chart and timeframe.</p>`, p => {
    p.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { closePop(); t.setMode(b.dataset.m); });
    p.querySelector('[data-a=undo]').onclick = () => { closePop(); const list = drawings[sym]; list.pop(); persistDrawings(); refreshSym(sym); };
    p.querySelector('[data-a=clear]').onclick = () => { closePop(); delete drawings[sym]; persistDrawings(); refreshSym(sym); };
  });
}

/* ---------- alerts ---------- */
// Alerts fire in the app for now. Email and text delivery needs the server that comes with live Schwab data.
const ALERT_KEY = 'multichart-alerts-v1';
let alerts = [];
try { alerts = JSON.parse(localStorage.getItem(ALERT_KEY)) || []; } catch (e) {}
function persistAlerts() { try { localStorage.setItem(ALERT_KEY, JSON.stringify(alerts)); } catch (e) {} paintBell(); }
function addAlert(sym, price) {
  const now = last(store(sym));
  alerts.push({ id: drawSeq++, sym, price, dir: price >= now ? 'above' : 'below', status: 'active' });
  persistAlerts(); refreshSym(sym);
  toast(`Alert set: <b>${esc(sym)}</b> ${price >= now ? 'rises to' : 'falls to'} <b>${price.toFixed(dec(now))}</b>`);
}
function removeAlert(id) {
  const a = alerts.find(x => x.id === id);
  alerts = alerts.filter(x => x.id !== id);
  persistAlerts();
  if (a) refreshSym(a.sym);
}
function checkAlerts() {
  let hit = false;
  alerts.forEach(a => {
    if (a.status !== 'active' || !stores[a.sym] || !ready(stores[a.sym])) return;
    const p = last(stores[a.sym]);
    if (!(p > 0)) return;
    if (a.dir === 'above' ? p >= a.price : p <= a.price) {
      a.status = 'triggered'; a.at = etTime.format(Date.now()); hit = true;
      toast(`<b>${esc(a.sym)}</b> ${a.dir === 'above' ? 'rose to' : 'fell to'} <b>${a.price.toFixed(dec(p))}</b> at ${a.at} ET`, true);
      refreshSym(a.sym);
    }
  });
  if (hit) { persistAlerts(); beep(); }
}
let audio = null;
document.addEventListener('pointerdown', () => { try { audio = audio || new AudioContext(); } catch (e) {} }, { once: true });
function beep() {
  try {
    if (!audio) return;
    const o = audio.createOscillator(), g = audio.createGain();
    o.frequency.value = 880; g.gain.setValueAtTime(0.15, audio.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.5);
    o.connect(g).connect(audio.destination); o.start(); o.stop(audio.currentTime + 0.5);
  } catch (e) {}
}
function toast(html, sticky) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<i></i><span>${html}</span>`;
  el.onclick = () => el.remove();
  document.getElementById('toasts').append(el);
  setTimeout(() => el.remove(), sticky ? 15000 : 3500);
}
function paintBell() {
  const btn = document.getElementById('alertsBtn'), n = alerts.filter(a => a.status === 'active').length;
  let b = btn.querySelector('.badge');
  if (!n) { if (b) b.remove(); return; }
  if (!b) { b = document.createElement('span'); b.className = 'badge'; btn.append(b); }
  b.textContent = n;
}
function alertsPop(anchor) {
  const firstChart = allCells().find(c => c.kind === 'chart');
  const sym = firstChart ? firstChart.sym : 'SPY';
  openPop(anchor, `
    <h4>Price alerts</h4>
    ${alerts.length ? `<div class="alist">${alerts.slice().reverse().map(a => `<div class="arow"><b>${esc(a.sym)}</b><span>${a.dir === 'above' ? '≥' : '≤'} <b>${a.price.toFixed(dec(a.price))}</b></span><span class="st ${a.status === 'triggered' ? 'hit' : ''}">${a.status === 'triggered' ? 'Hit ' + a.at : 'Watching'}</span><button data-del="${a.id}" aria-label="Delete alert">✕</button></div>`).join('')}</div>` : '<p class="empty">No alerts yet. Add one below, or use the draw button on a chart and tap a price.</p>'}
    <form class="aform" id="alertForm"><input class="s" id="alertSym" maxlength="8" value="${esc(sym)}" aria-label="Symbol" autocapitalize="characters"><input class="p" id="alertPrice" inputmode="decimal" placeholder="Price" aria-label="Alert price"><button class="btn primary" type="submit">Add</button></form>
    ${alerts.some(a => a.status === 'triggered') ? '<div class="menu"><button data-a="clear"><span>Clear alerts that already hit</span></button></div>' : ''}
    <p class="note">Alerts pop up and beep in the app. Email and text alerts come with the live data server.</p>`, p => {
    p.querySelectorAll('[data-del]').forEach(b => b.onclick = () => { removeAlert(+b.dataset.del); closePop(); alertsPop(anchor); });
    const clr = p.querySelector('[data-a=clear]');
    if (clr) clr.onclick = () => { alerts = alerts.filter(a => a.status !== 'triggered'); persistAlerts(); closePop(); alertsPop(anchor); };
    p.querySelector('#alertForm').onsubmit = e => {
      e.preventDefault();
      const s = p.querySelector('#alertSym').value.trim().toUpperCase().replace(/[^A-Z0-9.\/]/g, '');
      const price = parseFloat(p.querySelector('#alertPrice').value);
      if (!s || !(price > 0)) { p.querySelector(s ? '#alertPrice' : '#alertSym').focus(); return; }
      addAlert(s, price); closePop(); alertsPop(anchor);
    };
  });
}
document.getElementById('alertsBtn').addEventListener('click', e => alertsPop(e.currentTarget));
paintBell();

/* ---------- colors ---------- */

const COLOR_GROUPS = [
  ['Workspace', [['bg', 'App background'], ['head', 'Panel headers'], ['line', 'Borders'], ['fg', 'Text'], ['muted', 'Secondary text'], ['accent', 'Buttons and highlights'], ['pop', 'Menus']]],

  ['Level II', [['l2-1', 'Level 1 (best bid and ask)'], ['l2-2', 'Level 2'], ['l2-3', 'Level 3'], ['l2-4', 'Level 4'], ['l2-5', 'Level 5'], ['l2-6', 'Level 6 and deeper'], ['l2-text', 'Level text'], ['panel', 'Level II and T&S background']]],
  ['Time & Sales', [['ts-buy', 'Buys (at the ask)'], ['ts-sell', 'Sells (at the bid)'], ['ts-mid', 'Between bid and ask']]]
];

  'Dark': {},
  'DAS classic': {
    bg: '#000000', head: '#1b1b1b', line: '#3a3a3a', pop: '#141414', 'chart-bg': '#000000', panel: '#000000', grid: '#1a1a1a',
    'l2-1': '#ffff00', 'l2-2': '#00d000', 'l2-3': '#00c8ff', 'l2-4': '#ff5fd2', 'l2-5': '#ff9a00', 'l2-6': '#a0a0a0',
    'ts-buy': '#00ff00', 'ts-sell': '#ff3030', 'ts-mid': '#ffffff'
  },
  'Light': {

    muted: '#5b6878', accent: '#2457d6', up: '#0f8a62', down: '#d1433a', vwap: '#c026d3', ext: '#5b6878', pop: '#ffffff', 'l2-6': '#c9d1da',
    'ts-buy': '#0f8a62', 'ts-sell': '#d1433a', 'ts-mid': '#131b24'
  }
};
const DEFAULT_COLORS = {};
COLOR_GROUPS.forEach(([, list]) => list.forEach(([k]) => { DEFAULT_COLORS[k] = css('--' + k); }));
let colors = {};
try { colors = JSON.parse(localStorage.getItem(COLOR_KEY)) || {}; } catch (e) {}

// Extended-hours shading: the 'ext' color at this opacity (percent).
const shadePct = () => colors.extAlpha ?? 14;
let shadeFill = '';
function paintShade() {
  const pct = shadePct();
  shadeFill = pct ? css('--ext') + Math.round(pct * 2.55).toString(16).padStart(2, '0') : '';
  tiles.forEach(t => t.shade && t.shade.redraw());
}
const isLight = hex => { const n = parseInt(hex.slice(1), 16); return ((n >> 16) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000 > 140; };
function applyColors() {
  const root = document.documentElement;
  Object.keys(DEFAULT_COLORS).forEach(k => {
    if (colors[k]) root.style.setProperty('--' + k, colors[k]); else root.style.removeProperty('--' + k);
  });
  root.style.colorScheme = isLight(css('--bg')) ? 'light' : 'dark';
  paintShade();
  tiles.forEach(t => t.retheme());
  try { localStorage.setItem(COLOR_KEY, JSON.stringify(colors)); } catch (e) {}
}

const sheet = document.getElementById('sheet');
function openColors() {
  closePop();
  sheet.dataset.kind = 'colors';
  sheet.setAttribute('aria-label', 'Colors');
  sheet.innerHTML = `<div class="zin">

    <h4>Start from a theme</h4>
    <div class="themes">${Object.keys(THEMES).map(n => `<button data-theme-name="${n}">${n}</button>`).join('')}</div>
    ${COLOR_GROUPS.map(([group, list]) => `<h4>${group}</h4>` + list.map(([k, label]) =>
      `<label class="crow"><span>${label}</span><input type="color" id="c-${k}" data-k="${k}" value="${colors[k] || DEFAULT_COLORS[k]}"></label>` +
      (k === 'ext' ? `<label class="crow"><span>Shading opacity <b id="extPct">${shadePct()}%</b></span><input type="range" id="extAlpha" min="0" max="50" step="1" value="${shadePct()}"></label>` : '')).join('')).join('')}
    <button class="btn reset" id="resetColors">Reset to default colors</button></div>`;
  sheet.hidden = false;
  sheet.querySelector('#sheetClose').onclick = () => { sheet.hidden = true; };
  sheet.querySelectorAll('input[type=color]').forEach(inp => inp.addEventListener('input', () => { colors[inp.dataset.k] = inp.value; applyColors(); }));
  sheet.querySelector('#extAlpha').addEventListener('input', e => {
    colors.extAlpha = +e.target.value;
    sheet.querySelector('#extPct').textContent = colors.extAlpha + '%';
    paintShade();
    try { localStorage.setItem(COLOR_KEY, JSON.stringify(colors)); } catch (err) {}
  });
  sheet.querySelectorAll('[data-theme-name]').forEach(b => b.onclick = () => { colors = { ...THEMES[b.dataset.themeName], extAlpha: colors.extAlpha }; applyColors(); openColors(); });
  sheet.querySelector('#resetColors').onclick = () => { colors = {}; applyColors(); openColors(); };
}

const CLOSE_X = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4l8 8M12 4l-8 8"/></svg>';
function paintDataStatus() {
  const el = sheet.querySelector('.status');
  if (!el) return;
  const text = {
    demo: dataCfg.mode === 'schwab' ? 'Enter your app password below and tap Save to go live with Schwab.' : 'Using demo data. Prices are simulated.',
    connecting: 'Connecting to Alpaca…',
    live: dataCfg.mode === 'schwab' ? 'Live. Prices, Level II and trades are streaming from Schwab.' : 'Live. Prices and trades are streaming from Alpaca (IEX).',
    error: feed.msg || 'Something went wrong.'
  }[feed.state];
  el.dataset.state = feed.state;
  el.innerHTML = `<i></i><span>${esc(text)}</span>`;
}
// All of the app's settings as one code, to carry them to another device or to the Home Screen app,
// which iPhone keeps apart from Safari.
const SETTINGS_TAG = 'MC1.';
function settingsCode() {
  save();
  const all = {};
  for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('multichart-')) all[k] = localStorage.getItem(k); }
  return SETTINGS_TAG + b64.enc(JSON.stringify(all));
}
function loadSettings(code) {
  let all;
  try { all = JSON.parse(b64.dec(code.replace(/\s+/g, '').slice(SETTINGS_TAG.length))); } catch (e) {}
  if (!code.trim().startsWith(SETTINGS_TAG) || !all || typeof all !== 'object' || !Object.keys(all).length) return false;
  Object.keys(localStorage).filter(k => k.startsWith('multichart-')).forEach(k => localStorage.removeItem(k));
  Object.entries(all).forEach(([k, v]) => { if (k.startsWith('multichart-') && typeof v === 'string') localStorage.setItem(k, v); });
  location.reload();
  return true;
}
function openData() {
  closePop();
  sheet.dataset.kind = 'data';
  sheet.setAttribute('aria-label', 'Data source');
  const mode = dataCfg.mode;
  // On a new device (or a new Home Screen app), offer to bring settings over before anything else.
  const fresh = mode === 'schwab' && !dataCfg.pass;
  const move = `<div class="movebox">
      <h4>${fresh ? 'Coming from Safari or another device?' : 'Move your setup'}</h4>
      <p>${fresh ? 'Paste the settings you copied there (under <b>Move your setup</b>) to bring over your layouts, colors, drawings, alerts and live data in one step.'
        : 'Copy all your settings here, then paste them into the Home Screen app or another device: layouts, tabs, colors, drawings, alerts, zoom and live data. They include your app password, so only send them to yourself.'}</p>
      ${fresh ? '' : `<div class="row2"><button class="btn" id="dsCopyAll">Copy all my settings</button></div>
      <label class="field" id="dsAllBox" hidden>Your settings (select all and copy)<input id="dsAll" readonly></label>`}
      <label class="field">Paste settings from another device<input id="dsPasteAll" autocomplete="off" spellcheck="false" placeholder="MC1.…"></label>
      <div class="row2"><button class="btn${fresh ? ' primary' : ''}" id="dsLoadAll">Load settings</button></div>
    </div>`;
  sheet.innerHTML = `<div class="zin">
    <div class="sheet-head"><h3>Data source</h3><button class="ib" id="sheetClose" aria-label="Close data source">${CLOSE_X}</button></div>
    <div class="seg" role="group" aria-label="Data source">
      ${[['demo', 'Demo'], ['schwab', 'Schwab'], ['alpaca', 'Alpaca']].map(([m, label]) => `<button data-mode="${m}" aria-pressed="${mode === m}">${label}</button>`).join('')}
    </div>
    <div class="status"></div>
    ${fresh ? move : ''}
    <div class="srcbox" data-for="schwab" ${mode === 'schwab' ? '' : 'hidden'}>
      <h4>Your Schwab helper</h4>
      <label class="field">Helper address<input id="dsHelper" autocomplete="off" spellcheck="false" placeholder="https://multichart-schwab.yourname.workers.dev" value="${esc(dataCfg.helper)}"></label>
      <label class="field">App password<input id="dsPass" type="password" autocomplete="off" value="${esc(dataCfg.pass)}"></label>
      <p>The helper address is shown on the GitHub Actions page after the helper is set up. The app password is the APP_PASSWORD you chose.</p>
      <div class="row2"><button class="btn primary" id="dsHelperSave">Save</button></div>
      <h4>Sign in to Schwab</h4>
      <p id="dsSignState">${dataCfg.helper && dataCfg.pass ? 'Checking…' : 'Save the helper address and password first.'}</p>
      <ol>
        <li>Tap <b>Open Schwab sign-in</b>, log in with your Schwab login, and allow access.</li>
        <li>Schwab then sends you to a page that does not load. That is expected. Copy that page's whole address from the address bar.</li>
        <li>Paste it here and tap <b>Finish sign-in</b>.</li>
      </ol>
      <div class="row2"><button class="btn" id="dsOpenSchwab">Open Schwab sign-in</button></div>
      <label class="field">Address of the page Schwab sent you to<input id="dsPaste" autocomplete="off" spellcheck="false" placeholder="https://127.0.0.1/?code=…"></label>
      <div class="row2"><button class="btn primary" id="dsFinish">Finish sign-in</button></div>
      <p>Schwab asks you to sign in again every 7 days.</p>
      <h4>Your other devices</h4>
      <p>Open this link on your phone or another computer and the app goes live there straight away. It contains your app password, so only send it to yourself.</p>
      <div class="row2"><button class="btn" id="dsCopyLink">Copy setup link</button></div>
      <label class="field" id="dsLinkBox" hidden>Setup link<input id="dsLink" readonly></label>
      <h4>What is live</h4>
      <ul>
        <li><b>Charts</b>: full-market candles, including pre-market and after-hours.</li>
        <li><b>Last price and bid/ask</b>: real time.</li>
        <li><b>Level II</b>: real Nasdaq and NYSE order books.</li>
        <li><b>Time &amp; Sales</b>: built from Schwab's last-trade updates. Schwab has no full tape feed, so busy stocks show fewer prints than thinkorswim.</li>

    </div>
    <div class="srcbox" data-for="alpaca" ${mode === 'alpaca' ? '' : 'hidden'}>
      <h4>Alpaca keys</h4>
      <label class="field">Key ID<input id="dsKey" autocomplete="off" spellcheck="false" value="${esc(dataCfg.key)}"></label>
      <label class="field">Secret key<input id="dsSecret" type="password" autocomplete="off" spellcheck="false" value="${esc(dataCfg.secret)}"></label>
      <p>Your keys are saved only in this browser on this device. They are never put in the app's code.</p>
      <div class="row2"><button class="btn primary" id="dsSave">Connect</button><button class="btn" id="dsForget">Forget keys</button></div>
      <h4>What is live</h4>
      <ul>
        <li><b>Charts</b>: full-market candles. The free plan holds back the last 15 minutes, so that stretch is built from IEX trades and fills in as it catches up.</li>
        <li><b>Last price, bid/ask and Time &amp; Sales</b>: real time from IEX, one exchange that carries a few percent of all trading.</li>
        <li><b>Level II</b>: still simulated. No free source offers market depth.</li>
        <li>Up to 30 symbols at once. US stocks and ETFs only, not OTC.</li>
      </ul>
      <h4>Getting keys</h4>
      <ol>
        <li>Sign up free at <a href="https://alpaca.markets" target="_blank" rel="noopener">alpaca.markets</a>.</li>
        <li>In the dashboard, switch to <b>Paper</b> trading and find <b>API Keys</b>.</li>
        <li>Press <b>Generate</b>, then copy both keys here.</li>
      </ol>
      <details><summary>Advanced</summary>
        <label class="field">Data URL<input id="dsBase" placeholder="https://data.alpaca.markets" value="${esc(dataCfg.base)}"></label>
        <label class="field">Stream URL<input id="dsStream" placeholder="wss://stream.data.alpaca.markets/v2/iex" value="${esc(dataCfg.stream)}"></label>
      </details>

  sheet.hidden = false;
  paintDataStatus();
  const $ = id => sheet.querySelector('#' + id);
  const note = (msg, state = 'error') => { setFeed(state, msg); paintDataStatus(); };
  $('sheetClose').onclick = () => { sheet.hidden = true; };
  sheet.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {

  });
  // Schwab
  const signState = async () => {

    try {
      const st = await helper('/status');
      el.innerHTML = st.signedIn
        ? `Signed in. This sign-in lasts until <b>${esc(new Date(st.refreshExp).toLocaleString([], { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }))}</b>.`

  };
  $('dsCopyLink').onclick = async () => {
    if (!dataCfg.helper || !dataCfg.pass) return note('Save the helper address and app password first.');
    const link = setupLink();
    try { await navigator.clipboard.writeText(link); toast('Setup link copied. Send it to yourself and open it on the other device.'); }
    catch (e) { $('dsLinkBox').hidden = false; $('dsLink').value = link; $('dsLink').select(); }
  };
  $('dsOpenSchwab').onclick = () => {
    if (!dataCfg.helper) return note('Save the helper address first.');
    window.open(helperBase() + '/login', '_blank', 'noopener');
  };
  $('dsFinish').onclick = async () => {
    const pasted = $('dsPaste').value.trim();
    if (!pasted) return note('Paste the address of the page Schwab sent you to.');
    $('dsFinish').disabled = true;
    try {
      await helper('/token', { url: pasted });
      applyData({ mode: 'schwab' });

  if (mode === 'schwab') signState();
  // Moving settings
  if ($('dsCopyAll')) $('dsCopyAll').onclick = async () => {
    const code = settingsCode();
    try { await navigator.clipboard.writeText(code); toast('Settings copied. Open the Home Screen app (or the other device), tap the data badge at the top, and paste them.'); }
    catch (e) { $('dsAllBox').hidden = false; $('dsAll').value = code; $('dsAll').select(); }
  };
  $('dsLoadAll').onclick = () => {
    const code = $('dsPasteAll').value.trim();
    if (!code) return note('Paste the settings you copied first.');
    if (!code.startsWith(SETTINGS_TAG)) return note('That is not a settings code. On the other device, tap Copy all my settings and paste what it copies.');
    if (!fresh && !confirm('Replace the layouts, colors, alerts and settings in this app with the pasted ones?')) return;
    if (!loadSettings(code)) note('Those settings could not be read. Copy them again and paste the whole thing.');
  };
  // Alpaca
  $('dsSave').onclick = () => {
    const key = $('dsKey').value.trim(), secret = $('dsSecret').value.trim();
    if (!key || !secret) return note('Enter both the Key ID and the Secret key.');
    applyData({ mode: 'alpaca', key, secret, base: $('dsBase').value.trim(), stream: $('dsStream').value.trim() });
    openData();
  };
  $('dsForget').onclick = () => { applyData({ mode: 'demo', key: '', secret: '' }); openData(); };
}
document.getElementById('feedBtn').addEventListener('click', () => { if (sheet.hidden || sheet.dataset.kind !== 'data') openData(); else sheet.hidden = true; });
document.addEventListener('keydown', e => { if (e.key === 'Escape') sheet.hidden = true; });
applyColors();

/* ---------- go ---------- */
// Which side the camera cutout is on: the top of the phone points left at 90 degrees, right at 270.
function markCutout() {
  const a = screen.orientation ? screen.orientation.angle : (window.orientation || 0);
  const root = document.documentElement;
  root.classList.toggle('cut-left', a === 90);
  root.classList.toggle('cut-right', a === 270 || a === -90);
}
markCutout();
if (screen.orientation) screen.orientation.addEventListener('change', markCutout);
window.addEventListener('orientationchange', markCutout);
window.addEventListener('resize', markCutout);
render();
setFeed(isLive() ? 'connecting' : 'demo');
syncStream();
// A new device only lacks the app password (or its settings): open the data panel right away.
if (dataCfg.mode === 'schwab' && !dataCfg.pass) openData();
setInterval(() => {
  if (isLive()) { wanted().forEach(sym => { const s = store(sym); if (ready(s)) requote(s); }); syncStream(); }
  else wanted().forEach(sym => tick(store(sym)));
  tiles.forEach(t => t.update());
  checkAlerts();
}, 700);
setInterval(backfill, 60000);
})();
